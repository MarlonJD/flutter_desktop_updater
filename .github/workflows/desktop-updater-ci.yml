name: Desktop Updater CI

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  dart:
    name: Dart Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Check generated native contract fixtures
        run: dart run tool/generate_native_contract_fixtures.dart --check
      - name: Check generated native install helper fixtures
        run: dart run tool/generate_native_install_helper_fixtures.dart --check
      - name: Check generated native install helper policies
        run: dart run tool/generate_native_install_helper_policy.dart --check-fixtures
      - name: Record portable native helper fixture counts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          fixture_count="$(grep -h '"name"' fixtures/compat/native-install-helper/v1/*.json | wc -l | tr -d ' ')"
          test "$fixture_count" -gt 0
          printf 'platform=portable\nsuite=native-install-helper-fixtures\ntestCount=%s\n' "$fixture_count" > reports/native-helper-common-test-counts.txt
      - name: Check synchronized native SDK versions
        run: dart run tool/version_check.dart
      - name: Check formatting
        run: dart format --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test Dart surface
        run: flutter test --no-pub
      - name: Check CLI entrypoints
        run: |
          dart run desktop_updater --help
          dart run desktop_updater --version
          dart run desktop_updater release publish --help
          dart run desktop_updater package --help
          dart run desktop_updater verify --help
          dart run desktop_updater app-archive --help
          dart run desktop_updater:package --help
          dart run desktop_updater:verify --help
          dart run desktop_updater:app_archive --help
          dart run desktop_updater:release publish --help
      - name: Pub publish dry-run
        run: dart pub publish --dry-run
      - name: Upload portable native helper test counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-helper-test-counts-portable
          path: reports/native-helper-common-test-counts.txt
          if-no-files-found: ignore

  cli-candidates:
    name: Standalone CLI candidate (${{ matrix.artifact }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            artifact: desktop-updater-macos-arm64
            checksum: shasum -a 256
          - runner: macos-15-intel
            artifact: desktop-updater-macos-x64
            checksum: shasum -a 256
          - runner: windows-latest
            artifact: desktop-updater-windows-x64.exe
          - runner: ubuntu-latest
            artifact: desktop-updater-linux-x64
            checksum: sha256sum
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Build and checksum Unix candidate-only CLI
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p artifacts
          dart compile exe bin/desktop_updater.dart -o "artifacts/${{ matrix.artifact }}"
          chmod +x "artifacts/${{ matrix.artifact }}"
          "artifacts/${{ matrix.artifact }}" --version
          cd artifacts
          ${{ matrix.checksum }} "${{ matrix.artifact }}" > SHA256SUMS
      - name: Build and checksum Windows candidate-only CLI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          dart compile exe bin/desktop_updater.dart -o "artifacts/${{ matrix.artifact }}"
          & "artifacts/${{ matrix.artifact }}" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash "artifacts/${{ matrix.artifact }}" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ${{ matrix.artifact }}" | Set-Content artifacts/SHA256SUMS
      # CI outputs are unsigned candidate-only evidence. Production macOS and
      # Windows assets must use the repository's approved signing workflows.
      - name: Upload candidate-only CLI and SHA256SUMS
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-candidate-only
          path: |
            artifacts/${{ matrix.artifact }}
            artifacts/SHA256SUMS
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - name: Install dependencies
        run: flutter pub get
      - name: Configure standalone Windows native SDK tests
        run: cmake -S windows/native -B windows/native/build -DDESKTOP_UPDATER_NATIVE_BUILD_TESTS=ON -DDESKTOP_UPDATER_NATIVE_RUNTIME=ON
      - name: Build standalone Windows native SDK tests
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "windows-native-sdk-build.log"
          cmake --build windows/native/build --config Release 2>&1 |
            Tee-Object -FilePath $log
          $buildExit = $LASTEXITCODE
          if ($buildExit -ne 0) {
            $detail = (Get-Content -LiteralPath $log -Tail 60 -ErrorAction SilentlyContinue) -join "`n"
            $detail = [regex]::Replace($detail, '\x1B\[[0-?]*[ -/]*[@-~]', '')
            $detail = [regex]::Replace($detail, '[^\x09\x0A\x0D\x20-\x7E]', '')
            if ($detail.Length -gt 3500) {
              $detail = $detail.Substring($detail.Length - 3500)
            }
            $detail = $detail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows native SDK build failed::$detail"
            exit $buildExit
          }
      - name: Run Windows helper trust, pipe, transaction, and crash recovery tests
        shell: pwsh
        run: |
          $filter = "(WindowsHelperAuth|WindowsOneShotTransport|WindowsInstallAuthorizer|WindowsFileTransaction|WindowsCrashRecovery)"
          ctest --test-dir windows/native/build -C Release -R $filter --output-on-failure --no-tests=error
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $inventory = & ctest --test-dir windows/native/build -C Release -N -R $filter 2>&1
          $inventory | ForEach-Object { Write-Host $_ }
          $match = [regex]::Match(($inventory -join "`n"), "Total Tests:\s*([1-9][0-9]*)")
          if (-not $match.Success) {
            throw "Windows helper CTest registered zero trust/recovery tests."
          }
          New-Item -ItemType Directory -Path reports -Force | Out-Null
          "platform=windows`nsuite=helper-trust-pipe-transaction-recovery`ntestCount=$($match.Groups[1].Value)" | Set-Content reports/windows-helper-test-counts.txt
      - name: Run unprivileged Windows install helper smoke
        shell: pwsh
        run: ./tool/windows_install_helper_smoke.ps1 -Mode Unprivileged -BuildDirectory windows/native/build
      # Signed interactive UAC remains credential- and host-gated. The script
      # fails closed unless the fixed helper is Authenticode-valid and an
      # operator explicitly enables an interactive elevation prompt.
      - name: Run Windows Unicode and relative redirect target-host gates
        shell: pwsh
        run: |
          $serverOut = Join-Path $env:RUNNER_TEMP "native-transport-server.out"
          $serverErr = Join-Path $env:RUNNER_TEMP "native-transport-server.err"
          $server = Start-Process dart -ArgumentList @(
            "run", "tool/native_transport_fixture_server.dart", "--port", "43891"
          ) -RedirectStandardOutput $serverOut -RedirectStandardError $serverErr -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              try {
                Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:43891/health" | Out-Null
                $ready = $true
                break
              } catch {
                Start-Sleep -Milliseconds 250
              }
            }
            if (-not $ready) {
              Get-Content $serverOut, $serverErr -ErrorAction SilentlyContinue
              throw "Native transport fixture server did not start."
            }
            $env:DESKTOP_UPDATER_TRANSPORT_FIXTURE_URL = "http://127.0.0.1:43891"
            $output = & ctest --test-dir windows/native/build -C Release --output-on-failure 2>&1
            $exitCode = $LASTEXITCODE
            $output | ForEach-Object { Write-Host $_ }
            if ($exitCode -ne 0) { exit $exitCode }
            if (($output -join "`n") -match "No tests were found") {
              throw "Standalone Windows native CTest registered zero tests."
            }
          } finally {
            if (-not $server.HasExited) { Stop-Process -Id $server.Id -Force }
          }
      - name: Install Windows native SDK
        run: cmake --install windows/native/build --config Release --prefix windows/native/install
      - name: Verify installed Windows third-party notices
        shell: pwsh
        run: |
          $notice = "windows/native/install/share/doc/desktop_updater_native/THIRD_PARTY_NOTICES.md"
          if (-not (Test-Path -LiteralPath $notice -PathType Leaf)) {
            throw "Installed Windows SDK is missing $notice"
          }
      - name: Configure installed Windows CMake consumer
        shell: pwsh
        run: cmake -S example/native/windows-cmake -B example/native/windows-cmake/build "-DCMAKE_PREFIX_PATH=$env:GITHUB_WORKSPACE/windows/native/install"
      - name: Build installed Windows CMake consumer
        run: cmake --build example/native/windows-cmake/build --config Release
      - name: Run installed Windows CMake consumer
        shell: pwsh
        run: |
          $output = & ctest --test-dir example/native/windows-cmake/build -C Release --output-on-failure 2>&1
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) { exit $exitCode }
          if (($output -join "`n") -match "No tests were found") {
            throw "Windows installed consumer CTest registered zero tests."
          }
      - name: Run .NET native DLL consumer tests
        run: dotnet test windows/native/dotnet/DesktopUpdater.Native.Tests/DesktopUpdater.Native.Tests.csproj --configuration Release
      - name: Reject Debug CRT dependencies from Release native DLLs
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $visualStudio = & $vswhere -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($visualStudio)) {
            throw "Unable to locate Visual Studio C++ tools."
          }
          $dumpbin = Get-ChildItem "$visualStudio/VC/Tools/MSVC/*/bin/Hostx64/x64/dumpbin.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $dumpbin) { throw "Unable to locate dumpbin.exe." }
          $debugRuntimePattern = '(?i)\b(?:ucrtbased|vcruntime\d+(?:_\d+)?d|msvcp\d+(?:_[a-z_]+)?d)\.dll\b'
          $releaseDlls = @(
            "windows/native/build/Release/desktop_updater_native.dll",
            "windows/native/build/Release/desktop_updater_runtime.dll"
          )
          foreach ($dll in $releaseDlls) {
            $dependencies = (& $dumpbin.FullName /dependents $dll | Out-String)
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ($dependencies -match $debugRuntimePattern) {
              throw "$dll depends on Debug CRT $($Matches[0])"
            }
          }
      - name: Pack DesktopUpdater.Native
        shell: pwsh
        run: |
          $versionLine = Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)\s*$'
          if ($versionLine.Matches.Count -ne 1) {
            throw "Unable to read the canonical version from pubspec.yaml."
          }
          $version = $versionLine.Matches[0].Groups[1].Value
          $nativeDll = (Resolve-Path windows/native/build/Release/desktop_updater_native.dll).Path
          $runtimeDll = (Resolve-Path windows/native/build/Release/desktop_updater_runtime.dll).Path
          $installHelper = (Resolve-Path windows/native/build/Release/desktop_updater_install_helper.exe).Path
          $fixture = Get-Content -Raw fixtures/compat/native-install-helper/v1/policy-cases.json | ConvertFrom-Json
          $validPolicy = $fixture.cases | Where-Object { $_.expectedValid -eq $true } | Select-Object -First 1
          if ($null -eq $validPolicy -or [string]::IsNullOrWhiteSpace($validPolicy.canonicalJson)) {
            throw "No canonical helper policy fixture is available for NuGet packing."
          }
          $helperPolicy = Join-Path $env:RUNNER_TEMP "desktop_updater_helper_policy.json"
          [IO.File]::WriteAllText($helperPolicy, $validPolicy.canonicalJson, [Text.UTF8Encoding]::new($false))
          dotnet pack windows/native/dotnet/DesktopUpdater.Native/DesktopUpdater.Native.csproj --configuration Release --output windows/native/artifacts "-p:PackageVersion=$version" "-p:NativeDllPath=$nativeDll" "-p:RuntimeDllPath=$runtimeDll" "-p:InstallHelperPath=$installHelper" "-p:HelperPolicyPath=$helperPolicy"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "DESKTOP_UPDATER_NATIVE_PACKAGE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify DesktopUpdater.Native package contents
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $package = "windows/native/artifacts/DesktopUpdater.Native.$env:DESKTOP_UPDATER_NATIVE_PACKAGE_VERSION.nupkg"
          $packagePath = (Resolve-Path $package).Path
          $archive = [System.IO.Compression.ZipFile]::OpenRead($packagePath)
          try {
            $entries = @($archive.Entries | ForEach-Object { $_.FullName })
            $required = @(
              "lib/net8.0/DesktopUpdater.Native.dll",
              "lib/netstandard2.0/DesktopUpdater.Native.dll",
              "runtimes/win-x64/native/desktop_updater_native.dll",
              "runtimes/win-x64/native/desktop_updater_runtime.dll",
              "runtimes/win-x64/native/desktop_updater_install_helper.exe",
              "runtimes/win-x64/native/desktop_updater_helper_policy.json",
              "buildTransitive/DesktopUpdater.Native.targets",
              "THIRD_PARTY_NOTICES.md"
            )
            foreach ($entry in $required) {
              if ($entries -notcontains $entry) {
                throw "NuGet package is missing $entry"
              }
            }
            $nuspec = $archive.GetEntry("DesktopUpdater.Native.nuspec")
            if ($null -eq $nuspec) {
              throw "NuGet package is missing DesktopUpdater.Native.nuspec"
            }
            $reader = [System.IO.StreamReader]::new($nuspec.Open())
            try {
              $nuspecText = $reader.ReadToEnd()
            } finally {
              $reader.Dispose()
            }
            $escapedVersion = [regex]::Escape($env:DESKTOP_UPDATER_NATIVE_PACKAGE_VERSION)
            if ($nuspecText -notmatch "<version>$escapedVersion</version>") {
              throw "NuGet package version does not match pubspec.yaml"
            }
          } finally {
            $archive.Dispose()
          }
      - name: Run isolated Release NuGet P/Invoke consumer
        shell: pwsh
        run: |
          $laneRoot = Join-Path $env:RUNNER_TEMP "desktop-updater-nuget-regular"
          $build = Join-Path $laneRoot "build"
          $packageSource = (Resolve-Path windows/native/artifacts).Path
          $package = (Resolve-Path "windows/native/artifacts/DesktopUpdater.Native.$env:DESKTOP_UPDATER_NATIVE_PACKAGE_VERSION.nupkg").Path
          & tool/verify_windows_nuget_consumer.ps1 -PackagePath $package -PackageSource $packageSource -ProjectPath example/native/windows-dotnet/DesktopUpdater.Consumer.csproj -LaneRoot $laneRoot -OutputPath $build -PackageVersion $env:DESKTOP_UPDATER_NATIVE_PACKAGE_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet (Join-Path $build "DesktopUpdater.Consumer.dll")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows native runtime ZIP smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $smokeRoot = Join-Path $env:RUNNER_TEMP "native-runtime-windows-zip"
          $packageSource = (Resolve-Path windows/native/artifacts).Path
          $package = (Resolve-Path "windows/native/artifacts/DesktopUpdater.Native.$env:DESKTOP_UPDATER_NATIVE_PACKAGE_VERSION.nupkg").Path
          $build = Join-Path $smokeRoot "build"
          & tool/verify_windows_nuget_consumer.ps1 -PackagePath $package -PackageSource $packageSource -ProjectPath example/native/windows-dotnet-runtime/DesktopUpdater.RuntimeCompile.csproj -LaneRoot $smokeRoot -OutputPath $build -PackageVersion $env:DESKTOP_UPDATER_NATIVE_PACKAGE_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $install = Join-Path $smokeRoot "install"
          $payload = Join-Path $smokeRoot "payload"
          Copy-Item -LiteralPath $build -Destination $install -Recurse
          Copy-Item -LiteralPath $build -Destination $payload -Recurse
          "2.7.0" | Set-Content (Join-Path $install "version.txt")
          "2.7.1" | Set-Content (Join-Path $payload "version.txt")
          $installedIdentity = '{"packageId":"com.example.native-runtime-smoke","schemaVersion":1}'
          $installedIdentity | Set-Content -LiteralPath (Join-Path $install ".desktop_updater_install_identity.json") -NoNewline -Encoding utf8
          $installedIdentity | Set-Content -LiteralPath (Join-Path $payload ".desktop_updater_install_identity.json") -NoNewline -Encoding utf8
          $artifact = Join-Path $smokeRoot "update.zip"
          Compress-Archive -Path (Join-Path $payload "*") -DestinationPath $artifact
          $ready = Join-Path $smokeRoot "ready.json"
          $serverOut = Join-Path $smokeRoot "server.out"
          $serverErr = Join-Path $smokeRoot "server.err"
          $server = Start-Process dart -ArgumentList @(
            "run", "tool/native_runtime_smoke_server.dart",
            "--artifact", $artifact,
            "--artifact-kind", "zip",
            "--platform", "windows",
            "--package-id", "com.example.native-runtime-smoke",
            "--app-name", "NativeRuntimeSmoke",
            "--ready-file", $ready,
            "--port", "43892"
          ) -RedirectStandardOutput $serverOut -RedirectStandardError $serverErr -PassThru
          try {
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              if (Test-Path -LiteralPath $ready) {
                try {
                  Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:43892/health" | Out-Null
                  break
                } catch {}
              }
              Start-Sleep -Milliseconds 250
            }
            if (-not (Test-Path -LiteralPath $ready)) {
              Get-Content $serverOut, $serverErr -ErrorAction SilentlyContinue
              throw "Native runtime ZIP server did not start."
            }
            Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:43892/health" | Out-Null
            $serverInfo = Get-Content -Raw $ready | ConvertFrom-Json
            $env:DESKTOP_UPDATER_SMOKE_SKIP_RELAUNCH = "1"
            $diagnosticsPath = Join-Path $smokeRoot "helper-diagnostics.jsonl"
            & (Join-Path $install "DesktopUpdater.RuntimeCompile.exe") --smoke --app-archive-url $serverInfo.appArchiveUrl --public-key-base64 $serverInfo.publicKeyBase64 --package-id "com.example.native-runtime-smoke" --smoke-root (Join-Path $smokeRoot "runtime") --diagnostics-log $diagnosticsPath
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $stagingRoot = Join-Path $smokeRoot "runtime/staging"
            for ($attempt = 0; $attempt -lt 600; $attempt++) {
              $versionFile = Join-Path $install "version.txt"
              $versionReady = (Test-Path -LiteralPath $versionFile) -and ((Get-Content -Raw $versionFile).Trim() -eq "2.7.1")
              $stagingClean = (Test-Path -LiteralPath $stagingRoot -PathType Container) -and (@(Get-ChildItem -LiteralPath $stagingRoot -Force).Count -eq 0)
              $cleanupComplete = $false
              if (Test-Path -LiteralPath $diagnosticsPath) {
                $cleanupComplete = (Get-Content -Raw $diagnosticsPath) -match '"event":"cleanup success"'
              }
              if ($versionReady -and $stagingClean -and $cleanupComplete) { break }
              Start-Sleep -Milliseconds 250
            }
            if (-not $versionReady -or -not $stagingClean -or -not $cleanupComplete) {
              Get-Content -LiteralPath $diagnosticsPath -ErrorAction SilentlyContinue
            }
            if (-not $versionReady) {
              throw "Windows ZIP runtime smoke did not install version 2.7.1."
            }
            if (-not $stagingClean) {
              throw "Windows ZIP runtime smoke left an owned staging child."
            }
            $diagnostics = Get-Content -Raw $diagnosticsPath
            if ($diagnostics -notmatch '"event":"move success"' -or $diagnostics -notmatch '"event":"cleanup success"') {
              throw "Windows ZIP runtime smoke diagnostics are incomplete."
            }
          } finally {
            if (Test-Path -LiteralPath $ready) {
              $serverInfo = Get-Content -Raw $ready | ConvertFrom-Json
              try {
                Invoke-WebRequest -UseBasicParsing -Method Post "http://127.0.0.1:43892/shutdown?token=$($serverInfo.shutdownToken)" | Out-Null
              } catch {}
            }
            if (-not $server.HasExited) { $server.WaitForExit(5000) | Out-Null }
            if (-not $server.HasExited) { Stop-Process -Id $server.Id -Force }
            Remove-Item -LiteralPath $smokeRoot -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: Windows native runtime Inno smoke
        if: github.event_name == 'workflow_dispatch' && vars.DESKTOP_UPDATER_RUN_SIGNED_NATIVE_RUNTIME_E2E == '1'
        shell: pwsh
        env:
          WINDOWS_CODE_SIGNING_P12_BASE64: ${{ secrets.WINDOWS_CODE_SIGNING_P12_BASE64 }}
          WINDOWS_CODE_SIGNING_P12_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGNING_P12_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CODE_SIGNING_P12_BASE64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_CODE_SIGNING_P12_PASSWORD)) {
            throw "Signed Inno runtime smoke credentials are required."
          }
          choco install innosetup --no-progress -y
          $smokeRoot = Join-Path $env:RUNNER_TEMP "native-runtime-windows-inno"
          $packageSource = (Resolve-Path windows/native/artifacts).Path
          $package = (Resolve-Path "windows/native/artifacts/DesktopUpdater.Native.$env:DESKTOP_UPDATER_NATIVE_PACKAGE_VERSION.nupkg").Path
          $build = Join-Path $smokeRoot "build"
          & tool/verify_windows_nuget_consumer.ps1 -PackagePath $package -PackageSource $packageSource -ProjectPath example/native/windows-dotnet-runtime/DesktopUpdater.RuntimeCompile.csproj -LaneRoot $smokeRoot -OutputPath $build -PackageVersion $env:DESKTOP_UPDATER_NATIVE_PACKAGE_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $install = Join-Path $smokeRoot "install"
          $payload = Join-Path $smokeRoot "payload"
          Copy-Item -LiteralPath $build -Destination $install -Recurse
          Copy-Item -LiteralPath $build -Destination $payload -Recurse
          "2.7.0" | Set-Content (Join-Path $install "version.txt")
          "2.7.1" | Set-Content (Join-Path $payload "version.txt")
          $iss = Join-Path $smokeRoot "runtime-smoke.iss"
          @(
            "[Setup]",
            "AppId=NativeRuntimeSmoke",
            "AppName=NativeRuntimeSmoke",
            "AppVersion=2.7.1",
            "DefaultDirName={autopf}\NativeRuntimeSmoke",
            "OutputDir=$smokeRoot",
            "OutputBaseFilename=native-runtime-smoke",
            "Uninstallable=no",
            "PrivilegesRequired=lowest",
            "ArchitecturesAllowed=x64compatible",
            "[Files]",
            "Source: `"$payload\*`"; DestDir: `"{app}`"; Flags: ignoreversion recursesubdirs createallsubdirs"
          ) | Set-Content -LiteralPath $iss -Encoding UTF8
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" $iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = Join-Path $smokeRoot "native-runtime-smoke.exe"
          $pfx = Join-Path $smokeRoot "code-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CODE_SIGNING_P12_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          if ($null -eq $signtool) { throw "signtool.exe was not found." }
          & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:WINDOWS_CODE_SIGNING_P12_PASSWORD $installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $certificate = [Security.Cryptography.X509Certificates.X509Certificate2]::new($pfx, $env:WINDOWS_CODE_SIGNING_P12_PASSWORD)
          $sha256 = [Security.Cryptography.SHA256]::Create()
          try { $publisher = ([BitConverter]::ToString($sha256.ComputeHash($certificate.RawData))).Replace('-', '') } finally { $sha256.Dispose(); $certificate.Dispose() }
          $ready = Join-Path $smokeRoot "ready.json"
          $server = Start-Process dart -ArgumentList @(
            "run", "tool/native_runtime_smoke_server.dart",
            "--artifact", $installer,
            "--artifact-kind", "innoInstaller",
            "--platform", "windows",
            "--package-id", "com.example.native-runtime-smoke",
            "--app-name", "NativeRuntimeSmoke",
            "--publisher-thumbprint", $publisher,
            "--ready-file", $ready,
            "--port", "43895"
          ) -PassThru
          try {
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              if (Test-Path -LiteralPath $ready) {
                try { Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:43895/health" | Out-Null; break } catch {}
              }
              Start-Sleep -Milliseconds 250
            }
            Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:43895/health" | Out-Null
            $serverInfo = Get-Content -Raw $ready | ConvertFrom-Json
            $env:DESKTOP_UPDATER_SMOKE_SKIP_RELAUNCH = "1"
            & (Join-Path $install "DesktopUpdater.RuntimeCompile.exe") --smoke --app-archive-url $serverInfo.appArchiveUrl --public-key-base64 $serverInfo.publicKeyBase64 --package-id "com.example.native-runtime-smoke" --smoke-root (Join-Path $smokeRoot "runtime") --diagnostics-log (Join-Path $smokeRoot "helper-diagnostics.jsonl")
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            for ($attempt = 0; $attempt -lt 240; $attempt++) {
              if ((Test-Path (Join-Path $install "version.txt")) -and ((Get-Content -Raw (Join-Path $install "version.txt")).Trim() -eq "2.7.1")) { break }
              Start-Sleep -Milliseconds 250
            }
            if ((Get-Content -Raw (Join-Path $install "version.txt")).Trim() -ne "2.7.1") { throw "Windows Inno runtime smoke did not install version 2.7.1." }
            $diagnostics = Get-Content -Raw (Join-Path $smokeRoot "helper-diagnostics.jsonl")
            if ($diagnostics -notmatch '"event":"inno authenticode verified"' -or $diagnostics -notmatch '"event":"inno installer success"') { throw "Windows Inno runtime smoke diagnostics are incomplete." }
          } finally {
            if (Test-Path -LiteralPath $ready) {
              $serverInfo = Get-Content -Raw $ready | ConvertFrom-Json
              try { Invoke-WebRequest -UseBasicParsing -Method Post "http://127.0.0.1:43895/shutdown?token=$($serverInfo.shutdownToken)" | Out-Null } catch {}
            }
            if (-not $server.HasExited) { $server.WaitForExit(5000) | Out-Null }
            if (-not $server.HasExited) { Stop-Process -Id $server.Id -Force }
            Remove-Item -LiteralPath $smokeRoot -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: Build example
        working-directory: example
        run: flutter build windows --debug
      - name: Build native tests
        working-directory: example
        run: cmake --build build/windows/x64 --config Debug --target desktop_updater_test
      - name: Run native tests
        working-directory: example
        shell: pwsh
        run: |
          $output = & ctest --test-dir build/windows/x64 -C Debug --output-on-failure 2>&1
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) { exit $exitCode }
          if (($output -join "`n") -match "No tests were found") {
            throw "Flutter Windows Debug CTest registered zero tests."
          }
      - name: Run integration tests
        working-directory: example
        run: flutter test integration_test -d windows
      - name: Rebuild example for smoke
        working-directory: example
        run: flutter build windows --debug
      - name: Run update smoke
        working-directory: example
        run: dart run tool/updater_smoke.dart --diagnostics-log ../reports/windows-update-smoke-debug-diagnostics.jsonl
      - name: Windows Inno update smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tool/windows_inno_smoke.ps1
      - name: Upload update smoke diagnostics
        if: ${{ failure() || vars.DESKTOP_UPDATER_UPLOAD_SMOKE_DIAGNOSTICS == '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-update-smoke-debug-diagnostics
          path: reports/windows-update-smoke-debug-diagnostics.jsonl
          if-no-files-found: ignore
      - name: Upload Windows Inno update smoke diagnostics
        if: ${{ failure() || vars.DESKTOP_UPDATER_UPLOAD_SMOKE_DIAGNOSTICS == '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-inno-update-smoke-diagnostics
          path: reports/windows-inno-update-smoke-diagnostics.jsonl
          if-no-files-found: ignore
      - name: Build example release
        working-directory: example
        run: flutter build windows --release
      - name: Build native tests release
        working-directory: example
        run: cmake --build build/windows/x64 --config Release --target desktop_updater_test
      - name: Run native tests release
        working-directory: example
        shell: pwsh
        run: |
          $output = & ctest --test-dir build/windows/x64 -C Release --output-on-failure 2>&1
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) { exit $exitCode }
          if (($output -join "`n") -match "No tests were found") {
            throw "Flutter Windows Release CTest registered zero tests."
          }
      - name: Run integration tests release
        working-directory: example
        run: flutter test integration_test -d windows
      - name: Run release publish smoke
        working-directory: example
        run: dart run tool/release_publish_smoke.dart --platform windows
      - name: Run update smoke release
        working-directory: example
        run: dart run tool/updater_smoke.dart --config Release --diagnostics-log ../reports/windows-update-smoke-release-diagnostics.jsonl
      - name: Upload update smoke release diagnostics
        if: ${{ failure() || vars.DESKTOP_UPDATER_UPLOAD_SMOKE_DIAGNOSTICS == '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-update-smoke-release-diagnostics
          path: reports/windows-update-smoke-release-diagnostics.jsonl
          if-no-files-found: ignore
      - name: Upload Windows native helper test counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-helper-test-counts-windows
          path: reports/windows-helper-test-counts.txt
          if-no-files-found: ignore

  windows-elevated-helper:
    name: Windows Authenticode/UAC Helper (not run unless enabled)
    runs-on: [self-hosted, Windows, X64, desktop-updater-uac]
    if: github.event_name == 'workflow_dispatch' && vars.DESKTOP_UPDATER_RUN_ELEVATED_HELPER_E2E == '1'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Configure Release helper
        run: cmake -S windows/native -B windows/native/build-elevated -DDESKTOP_UPDATER_NATIVE_BUILD_TESTS=OFF
      - name: Build Release helper
        run: cmake --build windows/native/build-elevated --config Release --target desktop_updater_install_helper
      - name: Sign fixed helper with Authenticode
        shell: pwsh
        env:
          WINDOWS_CODE_SIGNING_P12_BASE64: ${{ secrets.WINDOWS_CODE_SIGNING_P12_BASE64 }}
          WINDOWS_CODE_SIGNING_P12_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGNING_P12_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CODE_SIGNING_P12_BASE64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_CODE_SIGNING_P12_PASSWORD)) {
            throw "Authenticode helper smoke credentials are required."
          }
          $pfx = Join-Path $env:RUNNER_TEMP "desktop-updater-helper-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CODE_SIGNING_P12_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          if ($null -eq $signtool) { throw "signtool.exe was not found." }
          $helper = (Resolve-Path windows/native/build-elevated/Release/desktop_updater_install_helper.exe).Path
          & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:WINDOWS_CODE_SIGNING_P12_PASSWORD $helper
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-AuthenticodeSignature -LiteralPath $helper).Status -ne "Valid") {
            throw "Signed helper did not pass Authenticode verification."
          }
      - name: Run Authenticode and interactive UAC helper smoke
        shell: pwsh
        env:
          DESKTOP_UPDATER_ALLOW_INTERACTIVE_UAC_SMOKE: "1"
        run: ./tool/windows_install_helper_smoke.ps1 -Mode Elevated -BuildDirectory windows/native/build-elevated
      - name: Remove ephemeral signing credential
        if: always()
        shell: pwsh
        run: Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP "desktop-updater-helper-signing.pfx") -Force -ErrorAction SilentlyContinue

  macos-native:
    name: macOS Native Consumer
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Validate macOS install helper configuration
        run: |
          plutil -lint macos/install_helper/Configuration/Helper-Info.plist
          plutil -lint macos/install_helper/Configuration/Helper-Launchd.plist
      - name: Run macOS install helper tests
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/macos-install-helper-tests.log"
          set +e
          swift test --package-path macos/install_helper 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            detail="$(tail -n 60 "$log" | LC_ALL=C tr -cd '\11\12\15\40-\176' | tail -c 3500)"
            detail=${detail//'%'/'%25'}
            detail=${detail//$'\r'/'%0D'}
            detail=${detail//$'\n'/'%0A'}
            printf '::error title=macOS install helper tests failed::%s\n' "$detail"
            exit "$status"
          fi
      - name: Run macOS unprivileged crash recovery suite
        shell: bash
        run: |
          set -euo pipefail
          swift test --package-path macos/install_helper --filter MacCrashRecoveryTests 2>&1 | tee "$RUNNER_TEMP/macos-crash-recovery-test.log"
          output="$(cat "$RUNNER_TEMP/macos-crash-recovery-test.log")"
          test_count="$(printf '%s\n' "$output" | sed -n 's/.*Executed \([0-9][0-9]*\) tests.*/\1/p' | tail -1)"
          test -n "$test_count"
          test "$test_count" -gt 0
          mkdir -p reports
          printf 'platform=macos\nsuite=unprivileged-crash-recovery\ntestCount=%s\n' "$test_count" > reports/macos-helper-test-counts.txt
      - name: Run unprivileged macOS install helper smoke
        run: dart run tool/macos_install_helper_smoke.dart --mode unprivileged
      - name: Typecheck macOS 10.14 CocoaPods fallback source set
        run: xcrun swiftc -typecheck -target x86_64-apple-macosx10.14 -swift-version 5 -module-cache-path "$RUNNER_TEMP/desktop-updater-swift-module-cache" -F "$FLUTTER_ROOT/bin/cache/artifacts/engine/darwin-x64/FlutterMacOS.xcframework/macos-arm64_x86_64" macos/desktop_updater/Sources/DesktopUpdaterKit/DesktopUpdaterVersion.swift macos/desktop_updater/Sources/DesktopUpdaterKit/Diagnostics.swift macos/desktop_updater/Sources/DesktopUpdaterKit/MacApplicationRestarter.swift macos/desktop_updater/Sources/DesktopUpdaterKit/MacInstallHelper.swift macos/desktop_updater/Sources/DesktopUpdaterKit/MacInstallRequest.swift macos/desktop_updater/Sources/desktop_updater/DesktopUpdaterPlugin.swift
      - name: Run DesktopUpdaterKit SwiftPM tests
        run: swift test --package-path .
      - name: Run external SwiftPM consumer
        run: swift run --package-path example/native/macos
      - name: macOS native runtime ZIP package and unsigned rejection smoke
        shell: bash
        run: |
          set -euo pipefail
          smoke_root="$RUNNER_TEMP/native-runtime-macos-zip"
          ready_file="$smoke_root/ready.json"
          package_id="com.example.native-runtime-smoke"
          app_name="NativeRuntimeSmoke.app"
          rm -rf "$smoke_root"
          mkdir -p "$smoke_root/install" "$smoke_root/payload"
          export DESKTOP_UPDATER_PACKAGE_PATH="$GITHUB_WORKSPACE"
          export DESKTOP_UPDATER_RUNTIME_ALLOWED_INSTALL_ROOT="$smoke_root/install"
          export DESKTOP_UPDATER_RUNTIME_PACKAGE_ID="$package_id"
          export DESKTOP_UPDATER_RUNTIME_APP_NAME="NativeRuntimeSmoke"
          export DESKTOP_UPDATER_RUNTIME_CODE_SIGN_IDENTITY="-"
          runtime_packager="$GITHUB_WORKSPACE/example/native/macos-runtime/package_smoke_app.sh"
          DESKTOP_UPDATER_RUNTIME_APP_VERSION="2.7.0" \
          DESKTOP_UPDATER_RUNTIME_APP_BUILD_NUMBER="270" \
          DESKTOP_UPDATER_RUNTIME_PACKAGE_WORK_DIR="$smoke_root/package-work-v1" \
            "$runtime_packager" "$smoke_root/install/$app_name"
          DESKTOP_UPDATER_RUNTIME_APP_VERSION="2.7.1" \
          DESKTOP_UPDATER_RUNTIME_APP_BUILD_NUMBER="271" \
          DESKTOP_UPDATER_RUNTIME_PACKAGE_WORK_DIR="$smoke_root/package-work-v2" \
            "$runtime_packager" "$smoke_root/payload/$app_name"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$smoke_root/payload/$app_name" "$smoke_root/update.zip"
          dart run tool/native_runtime_smoke_server.dart \
            --artifact "$smoke_root/update.zip" \
            --artifact-kind zip \
            --platform macos \
            --package-id "$package_id" \
            --app-name "$app_name" \
            --allow-unsigned-artifact \
            --ready-file "$ready_file" \
            --port 43892 > "$smoke_root/server.log" 2>&1 &
          server_pid=$!
          cleanup() {
            if [ -f "$ready_file" ]; then
              token="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["shutdownToken"])' "$ready_file")"
              curl --silent --request POST "http://127.0.0.1:43892/shutdown?token=$token" >/dev/null 2>&1 || true
            fi
            wait "$server_pid" 2>/dev/null || true
            rm -rf "$smoke_root"
          }
          trap cleanup EXIT
          for attempt in $(seq 1 60); do
            if [ -f "$ready_file" ] && curl --fail --silent http://127.0.0.1:43892/health >/dev/null; then break; fi
            sleep 0.25
          done
          test -f "$ready_file"
          curl --fail --silent http://127.0.0.1:43892/health >/dev/null
          archive_url="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["appArchiveUrl"])' "$ready_file")"
          public_key="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["publicKeyBase64"])' "$ready_file")"
          export DESKTOP_UPDATER_SMOKE_SKIP_RELAUNCH=1
          "$smoke_root/install/$app_name/Contents/MacOS/MacOSRuntimeCompile" \
            --smoke \
            --app-archive-url "$archive_url" \
            --public-key-base64 "$public_key" \
            --package-id "$package_id" \
            --smoke-root "$smoke_root/runtime" \
            --diagnostics-log "$smoke_root/helper-diagnostics.jsonl" \
            --allow-unsigned-updates \
            --expect-unsigned-handoff-rejection 2>&1 | tee "$smoke_root/client.log"
          grep -q 'Expected unsigned install handoff rejection' "$smoke_root/client.log"
          test "$(tr -d '\r\n' < "$smoke_root/install/$app_name/Contents/Resources/version.txt")" = "2.7.0"
          test -d "$smoke_root/runtime/staging"
          test -n "$(find "$smoke_root/runtime/staging" -mindepth 1 -maxdepth 1 -print -quit)"
          test ! -e "$smoke_root/helper-diagnostics.jsonl"
          test -s "$smoke_root/runtime/runtime-diagnostics.log"
          grep -q 'Verified native artifact is staged.' "$smoke_root/runtime/runtime-diagnostics.log"
      - name: Upload macOS native helper test counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-helper-test-counts-macos
          path: reports/macos-helper-test-counts.txt
          if-no-files-found: ignore

  macos-flutter:
    name: macOS Flutter (${{ matrix.integration }})
