  selective-gate:
    name: Selective CI gate
    if: always()
    needs:
      - changes
      - dart
      - docs
      - cli-candidates
      - windows
      - windows-elevated-helper
      - macos-native
      - macos-flutter
      - macos-notarized
      - macos-smappservice-helper
      - linux-polkit-helper
      - linux
    runs-on: ubuntu-latest
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      DART_RESULT: ${{ needs.dart.result }}
      DOCS_RESULT: ${{ needs.docs.result }}
      CLI_RESULT: ${{ needs['cli-candidates'].result }}
      WINDOWS_RESULT: ${{ needs.windows.result }}
      WINDOWS_ELEVATED_RESULT: ${{ needs['windows-elevated-helper'].result }}
      MACOS_NATIVE_RESULT: ${{ needs['macos-native'].result }}
      MACOS_FLUTTER_RESULT: ${{ needs['macos-flutter'].result }}
      MACOS_NOTARIZED_RESULT: ${{ needs['macos-notarized'].result }}
      MACOS_SMAPPSERVICE_RESULT: ${{ needs['macos-smappservice-helper'].result }}
      LINUX_POLKIT_RESULT: ${{ needs['linux-polkit-helper'].result }}
      LINUX_RESULT: ${{ needs.linux.result }}
      DART_SELECTED: ${{ needs.changes.outputs.full == 'true' || needs.changes.outputs.dart == 'true' }}
      DOCS_SELECTED: ${{ needs.changes.outputs.full == 'true' || needs.changes.outputs.docs == 'true' }}
      CLI_SELECTED: ${{ needs.changes.outputs.full == 'true' || needs.changes.outputs.cli == 'true' }}
      WINDOWS_SELECTED: ${{ needs.changes.outputs.full == 'true' || needs.changes.outputs.windows == 'true' || needs.changes.outputs.runtime == 'true' }}
      MACOS_SELECTED: ${{ needs.changes.outputs.full == 'true' || needs.changes.outputs.macos == 'true' || needs.changes.outputs.runtime == 'true' }}
      LINUX_SELECTED: ${{ needs.changes.outputs.full == 'true' || needs.changes.outputs.linux == 'true' || needs.changes.outputs.runtime == 'true' }}
    steps:
      - name: Require selected jobs to pass
        shell: bash
        run: |
          set -euo pipefail
          failed=false

          check_failure() {
            local name="$1"
            local result="$2"
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "$name finished with $result."
              failed=true
            fi
          }

          require_selected() {
            local name="$1"
            local selected="$2"
            local result="$3"
            if [[ "$selected" == "true" && "$result" != "success" ]]; then
              echo "$name was selected but finished with $result."
              failed=true
            fi
          }

          check_failure "changes" "$CHANGES_RESULT"
          check_failure "dart" "$DART_RESULT"
          check_failure "docs" "$DOCS_RESULT"
          check_failure "cli-candidates" "$CLI_RESULT"
          check_failure "windows" "$WINDOWS_RESULT"
          check_failure "windows-elevated-helper" "$WINDOWS_ELEVATED_RESULT"
          check_failure "macos-native" "$MACOS_NATIVE_RESULT"
          check_failure "macos-flutter" "$MACOS_FLUTTER_RESULT"
          check_failure "macos-notarized" "$MACOS_NOTARIZED_RESULT"
          check_failure "macos-smappservice-helper" "$MACOS_SMAPPSERVICE_RESULT"
          check_failure "linux-polkit-helper" "$LINUX_POLKIT_RESULT"
          check_failure "linux" "$LINUX_RESULT"

          require_selected "dart" "$DART_SELECTED" "$DART_RESULT"
          require_selected "docs" "$DOCS_SELECTED" "$DOCS_RESULT"
          require_selected "cli-candidates" "$CLI_SELECTED" "$CLI_RESULT"
          require_selected "windows" "$WINDOWS_SELECTED" "$WINDOWS_RESULT"
          require_selected "macos-native" "$MACOS_SELECTED" "$MACOS_NATIVE_RESULT"
          require_selected "macos-flutter" "$MACOS_SELECTED" "$MACOS_FLUTTER_RESULT"
          require_selected "linux" "$LINUX_SELECTED" "$LINUX_RESULT"

          if [[ "$failed" == "true" ]]; then
            exit 1
          fi
