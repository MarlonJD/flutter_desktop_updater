          flutter build macos --debug 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            detail="$(tail -n 60 "$log" | LC_ALL=C tr -cd '\11\12\15\40-\176' | tail -c 3500)"
            detail=${detail//'%'/'%25'}
            detail=${detail//$'\r'/'%0D'}
            detail=${detail//$'\n'/'%0A'}
            printf '::error title=macOS Flutter build failed::%s\n' "$detail"
            exit "$status"
          fi
      - name: Run macOS integration tests
        working-directory: example
        run: flutter test integration_test -d macos

  macos-notarized:
    name: macOS Notarized Publish
    runs-on: macos-latest
    if: github.event_name == 'workflow_dispatch' && (vars.DESKTOP_UPDATER_RUN_NOTARIZED_PUBLISH_E2E == '1' || vars.DESKTOP_UPDATER_RUN_SIGNED_NATIVE_RUNTIME_E2E == '1')
    # Signed production and native runtime lanes remain explicit
    # workflow_dispatch gates requiring Developer ID Application,
    # Developer ID Installer, and notary credentials:
    # dart run tool/macos_production_smoke.dart all --cleanup
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop
      - name: Install dependencies
        run: flutter pub get
      - name: Configure Developer ID certificate
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          test -n "$MACOS_CERTIFICATE_P12_BASE64"
          test -n "$MACOS_CERTIFICATE_PASSWORD"
          test -n "$MACOS_KEYCHAIN_PASSWORD"
          KEYCHAIN_PATH="$RUNNER_TEMP/desktop-updater-notary.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "DESKTOP_UPDATER_MACOS_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
      - name: Configure notary profile
        if: vars.DESKTOP_UPDATER_RUN_NOTARIZED_PUBLISH_E2E == '1' || vars.DESKTOP_UPDATER_RUN_SIGNED_NATIVE_RUNTIME_E2E == '1'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          DESKTOP_UPDATER_MACOS_NOTARY_PROFILE: desktop-updater-notary
        run: |
          test -n "$APPLE_ID"
          test -n "$APPLE_TEAM_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          xcrun notarytool store-credentials "$DESKTOP_UPDATER_MACOS_NOTARY_PROFILE" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --keychain "$DESKTOP_UPDATER_MACOS_KEYCHAIN"
          echo "DESKTOP_UPDATER_MACOS_NOTARY_PROFILE=$DESKTOP_UPDATER_MACOS_NOTARY_PROFILE" >> "$GITHUB_ENV"
      - name: Run notarized release publish smoke
        if: vars.DESKTOP_UPDATER_RUN_NOTARIZED_PUBLISH_E2E == '1'
        working-directory: example
        env:
          DESKTOP_UPDATER_RUN_NOTARIZED_PUBLISH_E2E: "1"
          DESKTOP_UPDATER_MACOS_DEVELOPER_ID_APPLICATION: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION }}
        run: dart run tool/release_publish_smoke.dart --platform macos --notarize
      - name: macOS native runtime DMG smoke
        if: vars.DESKTOP_UPDATER_RUN_SIGNED_NATIVE_RUNTIME_E2E == '1'
        env:
          DESKTOP_UPDATER_DEV_ID_APP: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION }}
          DESKTOP_UPDATER_DEV_ID_INSTALLER: ${{ secrets.MACOS_DEVELOPER_ID_INSTALLER }}
          DESKTOP_UPDATER_NOTARY_PROFILE: desktop-updater-notary
          DESKTOP_UPDATER_TEST_BUNDLE_ID: com.example.native-runtime-smoke
          DESKTOP_UPDATER_TEST_WORKDIR: ${{ runner.temp }}/native-runtime-macos-signed
          DESKTOP_UPDATER_TEST_VERSION_V1: "2.7.0"
          DESKTOP_UPDATER_TEST_VERSION_V2: "2.7.1"
          DESKTOP_UPDATER_TEST_BUILD_V1: "270"
          DESKTOP_UPDATER_TEST_BUILD_V2: "271"
          DESKTOP_UPDATER_KEEP_MACOS_SMOKE: "1"
          DESKTOP_UPDATER_RUNTIME_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          dart run tool/macos_production_smoke.dart dmg-update
          app_name="Desktop Updater Smoke"
          app_path="/Applications/$app_name.app"
          artifact="$DESKTOP_UPDATER_TEST_WORKDIR/$app_name.dmg"
          runtime_root="$DESKTOP_UPDATER_TEST_WORKDIR/native-dmg-runtime"
          runtime_install_root="$runtime_root/install"
          runtime_app="$runtime_install_root/$app_name.app"
          ready_file="$runtime_root/ready.json"
          mkdir -p "$runtime_install_root"
          DESKTOP_UPDATER_PACKAGE_PATH="$GITHUB_WORKSPACE" \
          DESKTOP_UPDATER_RUNTIME_ALLOWED_INSTALL_ROOT="$runtime_install_root" \
          DESKTOP_UPDATER_RUNTIME_PACKAGE_ID="$DESKTOP_UPDATER_TEST_BUNDLE_ID" \
          DESKTOP_UPDATER_RUNTIME_APP_NAME="$app_name" \
          DESKTOP_UPDATER_RUNTIME_APP_VERSION="$DESKTOP_UPDATER_TEST_VERSION_V1" \
          DESKTOP_UPDATER_RUNTIME_APP_BUILD_NUMBER="$DESKTOP_UPDATER_TEST_BUILD_V1" \
          DESKTOP_UPDATER_RUNTIME_CODE_SIGN_IDENTITY="$DESKTOP_UPDATER_DEV_ID_APP" \
          DESKTOP_UPDATER_RUNTIME_NOTARY_PROFILE="$DESKTOP_UPDATER_NOTARY_PROFILE" \
          DESKTOP_UPDATER_RUNTIME_PACKAGE_WORK_DIR="$runtime_root/package-work" \
            "$GITHUB_WORKSPACE/example/native/macos-runtime/package_smoke_app.sh" "$runtime_app"
          dart run tool/native_runtime_smoke_server.dart \
            --artifact "$artifact" \
            --artifact-kind dmg \
            --platform macos \
            --package-id "$DESKTOP_UPDATER_TEST_BUNDLE_ID" \
            --app-name "$app_name.app" \
            --ready-file "$ready_file" \
            --port 43893 > "$runtime_root/server.log" 2>&1 &
          server_pid=$!
          shutdown_server() {
            if [ -f "$ready_file" ]; then
              token="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["shutdownToken"])' "$ready_file")"
              curl --silent --request POST "http://127.0.0.1:43893/shutdown?token=$token" >/dev/null 2>&1 || true
            fi
            wait "$server_pid" 2>/dev/null || true
          }
          trap shutdown_server EXIT
          for attempt in $(seq 1 60); do
            if [ -f "$ready_file" ] && curl --fail --silent http://127.0.0.1:43893/health >/dev/null; then break; fi
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:43893/health >/dev/null
          archive_url="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["appArchiveUrl"])' "$ready_file")"
          public_key="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["publicKeyBase64"])' "$ready_file")"
          team_id="$(codesign -dv --verbose=4 "$app_path" 2>&1 | awk -F= '/^TeamIdentifier=/{print $2; exit}')"
          test -n "$team_id"
          export DESKTOP_UPDATER_SMOKE_SKIP_RELAUNCH=1
          "$runtime_app/Contents/MacOS/MacOSRuntimeCompile" \
            --smoke \
            --app-archive-url "$archive_url" \
            --public-key-base64 "$public_key" \
            --package-id "$DESKTOP_UPDATER_TEST_BUNDLE_ID" \
            --smoke-root "$runtime_root/client" \
            --diagnostics-log "$runtime_root/helper-diagnostics.jsonl" \
            --expected-team-identifier "$team_id"
          for attempt in $(seq 1 120); do
            if grep -q '"event":"cleanup success"' "$runtime_root/helper-diagnostics.jsonl" 2>/dev/null; then break; fi
            sleep 0.25
          done
          grep -q '"event":"move success"' "$runtime_root/helper-diagnostics.jsonl"
          grep -q '"event":"cleanup success"' "$runtime_root/helper-diagnostics.jsonl"
      - name: macOS native runtime PKG approval-required smoke
        if: vars.DESKTOP_UPDATER_RUN_SIGNED_NATIVE_RUNTIME_E2E == '1'
        env:
          DESKTOP_UPDATER_DEV_ID_APP: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION }}
          DESKTOP_UPDATER_DEV_ID_INSTALLER: ${{ secrets.MACOS_DEVELOPER_ID_INSTALLER }}
          DESKTOP_UPDATER_NOTARY_PROFILE: desktop-updater-notary
          DESKTOP_UPDATER_TEST_BUNDLE_ID: com.example.native-runtime-smoke
          DESKTOP_UPDATER_TEST_WORKDIR: ${{ runner.temp }}/native-runtime-macos-signed
          DESKTOP_UPDATER_TEST_VERSION_V1: "2.7.0"
          DESKTOP_UPDATER_TEST_VERSION_V2: "2.7.1"
          DESKTOP_UPDATER_TEST_BUILD_V1: "270"
          DESKTOP_UPDATER_TEST_BUILD_V2: "271"
          DESKTOP_UPDATER_KEEP_MACOS_SMOKE: "1"
          DESKTOP_UPDATER_RUNTIME_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          app_name="Desktop Updater Smoke"
          app_path="/Applications/$app_name.app"
          runtime_root="$DESKTOP_UPDATER_TEST_WORKDIR/native-pkg-runtime"
          runtime_package_root="$runtime_root/packaged"
          runtime_v1_app="$runtime_package_root/v1/$app_name.app"
          runtime_v2_app="$runtime_package_root/v2/$app_name.app"
          artifact="$runtime_root/$app_name.pkg"
          ready_file="$runtime_root/ready.json"
          mkdir -p "$runtime_package_root/v1" "$runtime_package_root/v2"
          DESKTOP_UPDATER_PACKAGE_PATH="$GITHUB_WORKSPACE" \
          DESKTOP_UPDATER_RUNTIME_ALLOWED_INSTALL_ROOT="/Applications" \
          DESKTOP_UPDATER_RUNTIME_PACKAGE_ID="$DESKTOP_UPDATER_TEST_BUNDLE_ID" \
          DESKTOP_UPDATER_RUNTIME_APP_NAME="$app_name" \
          DESKTOP_UPDATER_RUNTIME_APP_VERSION="$DESKTOP_UPDATER_TEST_VERSION_V1" \
          DESKTOP_UPDATER_RUNTIME_APP_BUILD_NUMBER="$DESKTOP_UPDATER_TEST_BUILD_V1" \
          DESKTOP_UPDATER_RUNTIME_CODE_SIGN_IDENTITY="$DESKTOP_UPDATER_DEV_ID_APP" \
          DESKTOP_UPDATER_RUNTIME_NOTARY_PROFILE="$DESKTOP_UPDATER_NOTARY_PROFILE" \
          DESKTOP_UPDATER_RUNTIME_PACKAGE_WORK_DIR="$runtime_root/package-work-v1" \
            "$GITHUB_WORKSPACE/example/native/macos-runtime/package_smoke_app.sh" "$runtime_v1_app"
          DESKTOP_UPDATER_PACKAGE_PATH="$GITHUB_WORKSPACE" \
          DESKTOP_UPDATER_RUNTIME_ALLOWED_INSTALL_ROOT="/Applications" \
          DESKTOP_UPDATER_RUNTIME_PACKAGE_ID="$DESKTOP_UPDATER_TEST_BUNDLE_ID" \
          DESKTOP_UPDATER_RUNTIME_APP_NAME="$app_name" \
          DESKTOP_UPDATER_RUNTIME_APP_VERSION="$DESKTOP_UPDATER_TEST_VERSION_V2" \
          DESKTOP_UPDATER_RUNTIME_APP_BUILD_NUMBER="$DESKTOP_UPDATER_TEST_BUILD_V2" \
          DESKTOP_UPDATER_RUNTIME_CODE_SIGN_IDENTITY="$DESKTOP_UPDATER_DEV_ID_APP" \
          DESKTOP_UPDATER_RUNTIME_NOTARY_PROFILE="$DESKTOP_UPDATER_NOTARY_PROFILE" \
          DESKTOP_UPDATER_RUNTIME_PACKAGE_WORK_DIR="$runtime_root/package-work-v2" \
          DESKTOP_UPDATER_RUNTIME_PKG_OUTPUT="$artifact" \
          DESKTOP_UPDATER_RUNTIME_PKG_INSTALLER_IDENTITY="$DESKTOP_UPDATER_DEV_ID_INSTALLER" \
          DESKTOP_UPDATER_RUNTIME_PKG_RECEIPT_ID="$DESKTOP_UPDATER_TEST_BUNDLE_ID.pkg" \
            "$GITHUB_WORKSPACE/example/native/macos-runtime/package_smoke_app.sh" "$runtime_v2_app"
          test -x "$runtime_v1_app/Contents/Helpers/DesktopUpdaterInstallHelper"
          test -x "$runtime_v2_app/Contents/Helpers/DesktopUpdaterInstallHelper"
          /usr/sbin/pkgutil --check-signature "$artifact"
          /usr/sbin/spctl --assess --type install "$artifact"
          /usr/bin/xcrun stapler validate "$artifact"
          owner_marker="$app_path/Contents/Resources/desktop_updater_smoke_owner.txt"
          if [ -e "$app_path" ]; then
            test -f "$owner_marker"
            grep -q 'desktop_updater macOS production smoke' "$owner_marker"
            grep -q "packageId=$DESKTOP_UPDATER_TEST_BUNDLE_ID" "$owner_marker"
            mv "$app_path" "$runtime_root/production-v1.app"
          fi
          /usr/bin/ditto "$runtime_v1_app" "$app_path"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$app_path"
          /usr/sbin/spctl --assess --type execute --verbose=2 "$app_path"
          /usr/bin/xcrun stapler validate "$app_path"
          team_id="$(codesign -dv --verbose=4 "$app_path" 2>&1 | awk -F= '/^TeamIdentifier=/{print $2; exit}')"
          test "$team_id" = "$DESKTOP_UPDATER_RUNTIME_TEAM_ID"
          dart run tool/native_runtime_smoke_server.dart \
            --artifact "$artifact" \
            --artifact-kind pkgInstaller \
            --platform macos \
            --package-id "$DESKTOP_UPDATER_TEST_BUNDLE_ID" \
            --app-name "$app_name.app" \
            --version "$DESKTOP_UPDATER_TEST_VERSION_V2" \
            --build-number "$DESKTOP_UPDATER_TEST_BUILD_V2" \
            --ready-file "$ready_file" \
            --port 43894 > "$runtime_root/server.log" 2>&1 &
          server_pid=$!
          shutdown_server() {
            if [ -f "$ready_file" ]; then
              token="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["shutdownToken"])' "$ready_file")"
              curl --silent --request POST "http://127.0.0.1:43894/shutdown?token=$token" >/dev/null 2>&1 || true
            fi
            wait "$server_pid" 2>/dev/null || true
          }
          trap shutdown_server EXIT
          for attempt in $(seq 1 60); do
            if [ -f "$ready_file" ] && curl --fail --silent http://127.0.0.1:43894/health >/dev/null; then break; fi
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:43894/health >/dev/null
          archive_url="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["appArchiveUrl"])' "$ready_file")"
          public_key="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["publicKeyBase64"])' "$ready_file")"
          export DESKTOP_UPDATER_SMOKE_SKIP_RELAUNCH=1
          "$app_path/Contents/MacOS/MacOSRuntimeCompile" \
            --smoke \
            --app-archive-url "$archive_url" \
            --public-key-base64 "$public_key" \
            --package-id "$DESKTOP_UPDATER_TEST_BUNDLE_ID" \
            --smoke-root "$runtime_root/client" \
            --diagnostics-log "$runtime_root/helper-diagnostics.jsonl" \
            --expected-team-identifier "$team_id" \
            --expect-helper-approval-required 2>&1 | tee "$runtime_root/client.log"
          grep -q 'Expected SMAppService admin approval requirement' "$runtime_root/client.log"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app_path/Contents/Info.plist")" = "2.7.0"
          test -d "$runtime_root/client/staging"
          test -n "$(find "$runtime_root/client/staging" -mindepth 1 -maxdepth 1 -print -quit)"
          test -s "$runtime_root/client/runtime-diagnostics.log"
      - name: Clean native runtime macOS smoke roots
        if: always() && vars.DESKTOP_UPDATER_RUN_SIGNED_NATIVE_RUNTIME_E2E == '1'
        env:
          DESKTOP_UPDATER_TEST_BUNDLE_ID: com.example.native-runtime-smoke
          DESKTOP_UPDATER_TEST_WORKDIR: ${{ runner.temp }}/native-runtime-macos-signed
        run: dart run tool/macos_production_smoke.dart cleanup

  macos-smappservice-helper:
    name: macOS SMAppService Privileged Helper (not run unless enabled)
    runs-on: [self-hosted, macOS, desktop-updater-smappservice]
    if: github.event_name == 'workflow_dispatch' && vars.DESKTOP_UPDATER_RUN_SMAPPSERVICE_E2E == '1'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Run signed bundled SMAppService daemon and XPC recovery smoke
        env:
          DESKTOP_UPDATER_SMAPPSERVICE_SMOKE_APP: ${{ vars.DESKTOP_UPDATER_SMAPPSERVICE_SMOKE_APP }}
          DESKTOP_UPDATER_SMAPPSERVICE_SMOKE_STAGED_APP: ${{ vars.DESKTOP_UPDATER_SMAPPSERVICE_SMOKE_STAGED_APP }}
        shell: bash
        run: |
          set -euo pipefail
          helper="$DESKTOP_UPDATER_SMAPPSERVICE_SMOKE_APP/Contents/Helpers/DesktopUpdaterInstallHelper"
          signature="$(codesign -d --verbose=4 "$helper" 2>&1)"
          printf '%s\n' "$signature"
          printf '%s\n' "$signature" | grep -q 'flags=.*runtime'
          mkdir -p reports
          dart run tool/macos_install_helper_smoke.dart --mode privileged | \
            tee reports/macos-smappservice-recovery.jsonl
      - name: Run preapproved signed PKG target-host smoke
        env:
          DESKTOP_UPDATER_SMAPPSERVICE_PKG_SMOKE_APP: ${{ vars.DESKTOP_UPDATER_SMAPPSERVICE_PKG_SMOKE_APP }}
          DESKTOP_UPDATER_SMAPPSERVICE_PKG_SMOKE_ARTIFACT: ${{ vars.DESKTOP_UPDATER_SMAPPSERVICE_PKG_SMOKE_ARTIFACT }}
          DESKTOP_UPDATER_SMAPPSERVICE_PKG_RECEIPT_ID: ${{ vars.DESKTOP_UPDATER_SMAPPSERVICE_PKG_RECEIPT_ID }}
          DESKTOP_UPDATER_SMAPPSERVICE_PKG_EXPECTED_VERSION: ${{ vars.DESKTOP_UPDATER_SMAPPSERVICE_PKG_EXPECTED_VERSION }}
          DESKTOP_UPDATER_SMAPPSERVICE_PKG_EXPECTED_BUILD: ${{ vars.DESKTOP_UPDATER_SMAPPSERVICE_PKG_EXPECTED_BUILD }}
        shell: bash
        run: |
          set -euo pipefail
          for variable in \
            DESKTOP_UPDATER_SMAPPSERVICE_PKG_SMOKE_APP \
            DESKTOP_UPDATER_SMAPPSERVICE_PKG_SMOKE_ARTIFACT \
            DESKTOP_UPDATER_SMAPPSERVICE_PKG_RECEIPT_ID \
            DESKTOP_UPDATER_SMAPPSERVICE_PKG_EXPECTED_VERSION \
            DESKTOP_UPDATER_SMAPPSERVICE_PKG_EXPECTED_BUILD; do
            test -n "${!variable:-}"
          done
          app="$(python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$DESKTOP_UPDATER_SMAPPSERVICE_PKG_SMOKE_APP")"
          artifact="$(python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$DESKTOP_UPDATER_SMAPPSERVICE_PKG_SMOKE_ARTIFACT")"
          receipt_id="$DESKTOP_UPDATER_SMAPPSERVICE_PKG_RECEIPT_ID"
          expected_version="$DESKTOP_UPDATER_SMAPPSERVICE_PKG_EXPECTED_VERSION"
          expected_build="$DESKTOP_UPDATER_SMAPPSERVICE_PKG_EXPECTED_BUILD"
          test "$(dirname "$app")" = /Applications
          test -d "$app"
          test -f "$artifact"
          test "${artifact##*.}" = pkg
          [[ "$receipt_id" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]
          [[ "$expected_build" =~ ^[0-9]+$ ]]
          info="$app/Contents/Info.plist"
          package_id="$(plutil -extract CFBundleIdentifier raw -o - "$info")"
          app_name="$(basename "$app")"
          executable="$(plutil -extract CFBundleExecutable raw -o - "$info")"
          service_id="$(plutil -extract DesktopUpdaterInstallHelperServiceID raw -o - "$info")"
          test "$executable" = MacOSRuntimeCompile
          test "$receipt_id" = "$package_id.pkg"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$info")" = 2.7.0
          test "$(plutil -extract CFBundleVersion raw -o - "$info")" = 270
          test "$(stat -f '%u:%g' "$app")" = 0:0
          test "$(stat -f '%u:%g' "$app/Contents/MacOS/$executable")" = 0:0
          test "$(stat -f '%u:%g' "$app/Contents/Helpers/DesktopUpdaterInstallHelper")" = 0:0
          test -x "$app/Contents/MacOS/$executable"
          test -x "$app/Contents/Helpers/DesktopUpdaterInstallHelper"
          test -f "$app/Contents/Library/LaunchDaemons/$service_id.plist"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"
          pkgutil --check-signature "$artifact"
          spctl --assess --type install --verbose=2 "$artifact"
          xcrun stapler validate "$artifact"
          team_id="$(codesign -dv --verbose=4 "$app" 2>&1 | awk -F= '/^TeamIdentifier=/{print $2; exit}')"
          helper_team_id="$(codesign -dv --verbose=4 "$app/Contents/Helpers/DesktopUpdaterInstallHelper" 2>&1 | awk -F= '/^TeamIdentifier=/{print $2; exit}')"
          test -n "$team_id"
          test "$helper_team_id" = "$team_id"
          smoke_root="$(mktemp -d "$RUNNER_TEMP/native-runtime-macos-pkg-target-host.XXXXXX")"
          ready_file="$smoke_root/ready.json"
          mkdir -p reports
          dart run tool/native_runtime_smoke_server.dart \
            --artifact "$artifact" \
            --artifact-kind pkgInstaller \
            --platform macos \
            --package-id "$package_id" \
            --app-name "$app_name" \
            --version "$expected_version" \
            --build-number "$expected_build" \
            --ready-file "$ready_file" \
            --port 43895 > "$smoke_root/server.log" 2>&1 &
          server_pid=$!
          shutdown_server() {
            if [ -f "$ready_file" ]; then
              token="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["shutdownToken"])' "$ready_file")"
              curl --silent --request POST "http://127.0.0.1:43895/shutdown?token=$token" >/dev/null 2>&1 || true
            fi
            wait "$server_pid" 2>/dev/null || true
          }
          trap shutdown_server EXIT
          for attempt in $(seq 1 60); do
            if [ -f "$ready_file" ] && curl --fail --silent http://127.0.0.1:43895/health >/dev/null; then break; fi
            sleep 0.25
          done
          test -f "$ready_file"
          curl --fail --silent http://127.0.0.1:43895/health >/dev/null
          archive_url="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["appArchiveUrl"])' "$ready_file")"
          public_key="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["publicKeyBase64"])' "$ready_file")"
          export DESKTOP_UPDATER_SMOKE_SKIP_RELAUNCH=1
          "$app/Contents/MacOS/$executable" \
            --smoke \
            --app-archive-url "$archive_url" \
            --public-key-base64 "$public_key" \
            --package-id "$package_id" \
            --smoke-root "$smoke_root/client" \
            --diagnostics-log "$smoke_root/helper-diagnostics.jsonl" \
            --expected-team-identifier "$team_id" 2>&1 | \
            tee "$smoke_root/client.log"
          grep -q 'installAndRelaunch scheduled' "$smoke_root/client.log"
          installed=0
          for attempt in $(seq 1 240); do
            version="$(plutil -extract CFBundleShortVersionString raw -o - "$info" 2>/dev/null || true)"
            build="$(plutil -extract CFBundleVersion raw -o - "$info" 2>/dev/null || true)"
            if [ "$version" = "$expected_version" ] && \
               [ "$build" = "$expected_build" ] && \
               pkgutil --pkg-info "$receipt_id" >/dev/null 2>&1; then
              installed=1
              break
            fi
            sleep 0.5
          done
          test "$installed" -eq 1
          pkgutil --pkg-info-plist "$receipt_id" > "$smoke_root/receipt.plist"
          test "$(plutil -extract pkg-version raw -o - "$smoke_root/receipt.plist")" = "$expected_version"
          post_info="$app/Contents/Info.plist"
          post_package_id="$(plutil -extract CFBundleIdentifier raw -o - "$post_info")"
          post_executable="$(plutil -extract CFBundleExecutable raw -o - "$post_info")"
          post_service_id="$(plutil -extract DesktopUpdaterInstallHelperServiceID raw -o - "$post_info")"
          test "$post_package_id" = "$package_id"
          test "$post_executable" = "$executable"
          test "$post_service_id" = "$service_id"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$post_info")" = "$expected_version"
          test "$(plutil -extract CFBundleVersion raw -o - "$post_info")" = "$expected_build"
          post_helper="$app/Contents/Helpers/DesktopUpdaterInstallHelper"
          post_launchd="$app/Contents/Library/LaunchDaemons/$post_service_id.plist"
          test -x "$app/Contents/MacOS/$post_executable"
          test -x "$post_helper"
          test -f "$post_launchd"
          test "$(plutil -extract Label raw -o - "$post_launchd")" = "$post_service_id"
          test "$(plutil -extract BundleProgram raw -o - "$post_launchd")" = Contents/Helpers/DesktopUpdaterInstallHelper
          test "$(stat -f '%u:%g' "$app")" = 0:0
          test "$(stat -f '%u:%g' "$app/Contents/MacOS/$post_executable")" = 0:0
          test "$(stat -f '%u:%g' "$post_helper")" = 0:0
          test "$(stat -f '%u:%g' "$post_launchd")" = 0:0
          codesign --verify --strict --verbose=2 "$post_helper"
          post_app_team_id="$(codesign -dv --verbose=4 "$app" 2>&1 | awk -F= '/^TeamIdentifier=/{print $2; exit}')"
          post_helper_team_id="$(codesign -dv --verbose=4 "$post_helper" 2>&1 | awk -F= '/^TeamIdentifier=/{print $2; exit}')"
          test "$post_app_team_id" = "$team_id"
          test "$post_helper_team_id" = "$team_id"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"
          launchctl print "system/$post_service_id" > "$smoke_root/launchd.txt"
          grep -Eq '^[[:space:]]*pid = [1-9][0-9]*$' "$smoke_root/launchd.txt"
          for attempt in $(seq 1 120); do
            if [ -d "$smoke_root/client/staging" ] && \
               [ -z "$(find "$smoke_root/client/staging" -mindepth 1 -maxdepth 1 -print -quit)" ]; then
              break
            fi
            sleep 0.25
          done
          test -d "$smoke_root/client/staging"
          test -z "$(find "$smoke_root/client/staging" -mindepth 1 -maxdepth 1 -print -quit)"
          test -s "$smoke_root/client/runtime-diagnostics.log"
          printf 'platform=macos\nsuite=smappservice-pkg-target-host\nprivilegedDaemonExecuted=true\npackageReceiptVerified=true\ninstalledHelperVerified=true\ninstalledLaunchDaemonVerified=true\ninstalledVersion=%s\ninstalledBuild=%s\n' \
            "$expected_version" "$expected_build" \
            > reports/macos-smappservice-pkg.txt
      - name: Upload macOS SMAppService target-host evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-smappservice-target-host-evidence
          path: |
            reports/macos-smappservice-recovery.jsonl
            reports/macos-smappservice-pkg.txt
          if-no-files-found: ignore

  linux-polkit-helper:
    name: Linux Installed Polkit Broker (not run unless enabled)
    runs-on: [self-hosted, Linux, X64, desktop-updater-polkit]
    if: github.event_name == 'workflow_dispatch' && vars.DESKTOP_UPDATER_RUN_POLKIT_HELPER_E2E == '1'
    steps:
      - uses: actions/checkout@v4
      - name: Build test-only caller and sealed fixed broker
        shell: bash
        run: |
          set -euo pipefail
          build="$RUNNER_TEMP/desktop-updater-polkit-build"
          package_id=com.example.desktop-updater.polkit-e2e
          allowed_root="/opt/desktop-updater-polkit-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cmake -S linux/native -B "$build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DDESKTOP_UPDATER_NATIVE_BUILD_TESTS=ON \
            -DDESKTOP_UPDATER_ENABLE_POLKIT_E2E_FAULT_INJECTION=ON
          cmake --build "$build" \
            --target desktop-updater-helper linux_polkit_e2e_fixture
          helper_sha="$(sha256sum "$build/desktop-updater-helper" | awk '{print $1}')"
          caller_sha="$(sha256sum "$build/linux_polkit_e2e_fixture" | awk '{print $1}')"
          # linux_polkit_e2e_fixture --canonical-policy uses a deterministic,
          # test-only Ed25519 key and binds the actual helper/caller bytes.
          canonical_policy_json="$(
            "$build/linux_polkit_e2e_fixture" --canonical-policy \
              "$caller_sha" "$helper_sha" "$allowed_root"
          )"
          test "$(printf '%s' "$canonical_policy_json" | jq -cS .)" = "$canonical_policy_json"
          canonical_policy_sha="$(printf '%s' "$canonical_policy_json" | sha256sum | awk '{print $1}')"
          escaped_policy_json="$(printf '%s' "$canonical_policy_json" | jq -Rs .)"
          escaped_policy_json="${escaped_policy_json#\"}"
          escaped_policy_json="${escaped_policy_json%\"}"
          cmake -S linux/native -B "$build" \
            -DDESKTOP_UPDATER_INSTALL_SYSTEM_BROKER=ON \
            "-DDESKTOP_UPDATER_HELPER_POLICY_PACKAGE_ID=$package_id" \
            "-DDESKTOP_UPDATER_HELPER_SHA256=$helper_sha" \
            "-DDESKTOP_UPDATER_HELPER_CANONICAL_POLICY_JSON=$escaped_policy_json" \
            "-DDESKTOP_UPDATER_HELPER_CANONICAL_POLICY_SHA256=$canonical_policy_sha"
          cmake --build "$build" \
            --target desktop-updater-helper linux_polkit_e2e_fixture
          test "$(sha256sum "$build/desktop-updater-helper" | awk '{print $1}')" = "$helper_sha"
          test "$(sha256sum "$build/linux_polkit_e2e_fixture" | awk '{print $1}')" = "$caller_sha"
          sudo -n install -d -o root -g root -m 0755 \
            /usr/libexec /usr/share/polkit-1/actions \
            /etc/desktop-updater/policies
          sudo -n install -o root -g root -m 0755 \
            "$build/desktop-updater-helper" \
            /usr/libexec/desktop-updater-helper
          sudo -n install -o root -g root -m 0755 \
            "$build/linux_polkit_e2e_fixture" \
            /usr/libexec/desktop-updater-polkit-e2e-fixture
          sudo -n install -o root -g root -m 0644 \
            "$build/com.desktopupdater.install.policy" \
            /usr/share/polkit-1/actions/com.desktopupdater.install.policy
          sudo -n install -o root -g root -m 0644 \
            "$build/$package_id.json" \
            "/etc/desktop-updater/policies/$package_id.json"
          {
            printf 'DESKTOP_UPDATER_LINUX_POLICY_PACKAGE_ID=%s\n' "$package_id"
            printf 'DESKTOP_UPDATER_LINUX_HELPER_SHA256=%s\n' "$helper_sha"
            printf 'DESKTOP_UPDATER_LINUX_E2E_CALLER_SHA256=%s\n' "$caller_sha"
            printf 'DESKTOP_UPDATER_LINUX_E2E_ALLOWED_ROOT=%s\n' "$allowed_root"
            printf 'DESKTOP_UPDATER_LINUX_E2E_CALLER=%s\n' \
              /usr/libexec/desktop-updater-polkit-e2e-fixture
          } >> "$GITHUB_ENV"
      - name: Run installed broker static audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          sudo -n env \
            DESKTOP_UPDATER_LINUX_POLICY_PACKAGE_ID="$DESKTOP_UPDATER_LINUX_POLICY_PACKAGE_ID" \
            DESKTOP_UPDATER_LINUX_HELPER_SHA256="$DESKTOP_UPDATER_LINUX_HELPER_SHA256" \
            DESKTOP_UPDATER_LINUX_E2E_CALLER_SHA256="$DESKTOP_UPDATER_LINUX_E2E_CALLER_SHA256" \
            DESKTOP_UPDATER_LINUX_E2E_ALLOWED_ROOT="$DESKTOP_UPDATER_LINUX_E2E_ALLOWED_ROOT" \
            DESKTOP_UPDATER_LINUX_E2E_CALLER="$DESKTOP_UPDATER_LINUX_E2E_CALLER" \
            sh tool/linux_install_helper_smoke.sh --mode root-broker-audit | \
            tee reports/linux-polkit-static-audit.txt
      - name: Run real non-root polkit broker E2E
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          sh tool/linux_install_helper_smoke.sh --mode root-broker | \
            tee reports/linux-polkit-root-broker-e2e.txt
      - name: Upload installed polkit broker evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-installed-polkit-broker-evidence
          path: reports/linux-polkit-*.txt
          if-no-files-found: error
      - name: Remove installed broker smoke artifacts
        if: always()
        shell: bash
        run: |
          sudo -n rm -f \
            /var/lib/desktop-updater/desktop-updater-polkit-e2e-crash-after-backup \
            /usr/libexec/desktop-updater-helper \
            /usr/libexec/desktop-updater-polkit-e2e-fixture \
            /usr/share/polkit-1/actions/com.desktopupdater.install.policy \
            /etc/desktop-updater/policies/com.example.desktop-updater.polkit-e2e.json
          case "${DESKTOP_UPDATER_LINUX_E2E_ALLOWED_ROOT:-}" in
            /opt/desktop-updater-polkit-e2e-*)
              sudo -n rm -rf -- "$DESKTOP_UPDATER_LINUX_E2E_ALLOWED_ROOT"
              ;;
          esac

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libcurl4-openssl-dev libgtk-3-dev libssl-dev ninja-build pkg-config xvfb zip
      - name: Configure standalone Linux native tests
        run: cmake -S linux/native -B linux/native/build -DDESKTOP_UPDATER_NATIVE_BUILD_TESTS=ON -DDESKTOP_UPDATER_NATIVE_RUNTIME=ON
      - name: Build standalone Linux native tests
        run: cmake --build linux/native/build
      - name: Run Linux unprivileged helper and crash recovery tests
        shell: bash
        run: |
          set -euo pipefail
          filter='(LinuxHelperAuth|linux_transaction|linux_crash_recovery)'
          log="$RUNNER_TEMP/linux-helper-recovery-tests.log"
          set +e
          ctest --test-dir linux/native/build -R "$filter" --output-on-failure --no-tests=error 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            detail="$(tail -n 60 "$log" | LC_ALL=C tr -cd '\11\12\15\40-\176' | tail -c 3500)"
            detail=${detail//'%'/'%25'}
            detail=${detail//$'\r'/'%0D'}
            detail=${detail//$'\n'/'%0A'}
            printf '::error title=Linux helper and recovery tests failed::%s\n' "$detail"
            exit "$status"
          fi
          test_count="$(ctest --test-dir linux/native/build -N -R "$filter" | sed -n 's/Total Tests: *\([1-9][0-9]*\)/\1/p')"
          test -n "$test_count"
          mkdir -p reports
          printf 'platform=linux\nsuite=unprivileged-helper-recovery\ntestCount=%s\n' "$test_count" > reports/linux-helper-test-counts.txt
      - name: Run Linux privileged mount namespace rejection test
        shell: bash
        run: |
          set -euo pipefail
          filter='^linux_transaction\.LinuxFileTransaction\.(RejectsBindMountAndMountIdChange|CleanupRejectsNestedBindMountBeforeDeletingBackingData)$'
          sudo ctest --test-dir linux/native/build -R "$filter" --output-on-failure --no-tests=error | tee "$RUNNER_TEMP/linux-privileged-mount-test.log"
          if grep -q 'Skipped' "$RUNNER_TEMP/linux-privileged-mount-test.log"; then
            echo "Linux privileged mount namespace test was skipped"
            exit 1
          fi
          test_count="$(ctest --test-dir linux/native/build -N -R "$filter" | sed -n 's/Total Tests: *\([1-9][0-9]*\)/\1/p')"
          test -n "$test_count"
          test "$test_count" -ge 2
          printf 'platform=linux\nsuite=privileged-mount-namespace\ntestCount=%s\n' "$test_count" >> reports/linux-helper-test-counts.txt
      - name: Run unprivileged Linux install helper smoke
        run: sh tool/linux_install_helper_smoke.sh --mode unprivileged
      - name: Run Linux native tamper target-host gates
        run: |
          dart run tool/native_transport_fixture_server.dart --port 43891 >"$RUNNER_TEMP/native-transport-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:43891/health >/dev/null; then
              ready=1
              break
            fi
            sleep 0.25
          done
          if [ "$ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/native-transport-server.log"
            exit 1
          fi
          export DESKTOP_UPDATER_TRANSPORT_FIXTURE_URL=http://127.0.0.1:43891
          set +e
          output="$(ctest --test-dir linux/native/build --output-on-failure 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          if [[ "$output" == *"No tests were found"* ]]; then
            echo "Linux native CTest registered zero tests"
            exit 1
          fi
      - name: Install Linux native SDK
        run: cmake --install linux/native/build --prefix "$PWD/linux/native/install"
      - name: Verify Linux portable retail inventory
        run: |
          test -x linux/native/install/libexec/desktop-updater-helper
          test ! -e linux/native/install/share/polkit-1/actions/com.desktopupdater.install.policy
          test ! -e linux/native/install/etc/desktop-updater/policies
      - name: Verify installed Linux third-party notices
        run: test -f linux/native/install/share/doc/desktop_updater_native/THIRD_PARTY_NOTICES.md
      - name: Verify installed Linux pkg-config version
        run: |
          expected="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml)"
          actual="$(PKG_CONFIG_PATH="$PWD/linux/native/install/lib/pkgconfig" pkg-config --modversion desktop_updater_native)"
          test "$actual" = "$expected"
      - name: Build and run installed Linux pkg-config consumer
        shell: bash
        run: |
          set -euo pipefail
          package_id=com.example.desktop-updater.installed-consumer
          prefix="$PWD/linux/native/install-pkg-consumer"
          stage="$PWD/linux/native/desktop_updater_stage_123e4567-e89b-42d3-a456-426614174101"
          runtime="/tmp/du-${UID}-pkg"
