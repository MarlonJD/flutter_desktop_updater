          prefix="$PWD/linux/native/install-cmake-consumer"
          stage="$PWD/linux/native/desktop_updater_stage_123e4567-e89b-42d3-a456-426614174103"
          runtime="/tmp/du-${UID}-cmake"
          helper="$prefix/libexec/desktop-updater-helper"
          test ! -e "$runtime"
          linux/native/build/linux_polkit_e2e_fixture \
