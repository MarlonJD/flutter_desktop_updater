          linux/native/build/linux_polkit_e2e_fixture \
            --canonical-portable-consumer-policy \
            "$caller_sha" "$helper_sha" "$package_id" \
            > "$prefix/libexec/desktop-updater-helper.policy.json"
          mkdir -m 0700 "$runtime" "$prefix/state"
          XDG_RUNTIME_DIR="$runtime" XDG_STATE_HOME="$prefix/state" \
            "$prefix/bin/linux_installed_consumer" --exchange "$stage"
          for attempt in $(seq 1 100); do
