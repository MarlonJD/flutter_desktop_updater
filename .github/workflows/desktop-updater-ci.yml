            "-DDESKTOP_UPDATER_INSTALLED_HELPER_PATH=\"$helper\"" \
            -o "$prefix/bin/linux_installed_consumer"
          linux/native/build/linux_polkit_e2e_fixture \
            --prepare-portable-consumer-stage "$stage" 2.7.1 \
            "$prefix/bin/linux_installed_consumer" linux_installed_consumer \
            "$package_id"
          printf '{"packageId":"%s","schemaVersion":1}' "$package_id" \
            > "$prefix/bin/.desktop_updater_install_identity.json"
          caller_sha="$(sha256sum "$prefix/bin/linux_installed_consumer" | awk '{print $1}')"
          helper_sha="$(sha256sum "$helper" | awk '{print $1}')"
