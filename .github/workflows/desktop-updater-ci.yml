            > "$prefix/libexec/desktop-updater-helper.policy.json"
          mkdir -m 0700 "$runtime" "$prefix/state"
          XDG_RUNTIME_DIR="$runtime" XDG_STATE_HOME="$prefix/state" \
            "$prefix/bin/linux_installed_consumer" --exchange "$stage"
          for attempt in $(seq 1 100); do
            test -f "$prefix/bin/version.txt" && break
            sleep 0.05
          done
          test "$(cat "$prefix/bin/version.txt")" = 2.7.2
          rmdir "$runtime"
      - name: Configure installed Linux CMake consumer
        shell: bash
        run: |
          set -euo pipefail
          prefix="$PWD/linux/native/install-cmake-consumer"
          stage="$PWD/linux/native/desktop_updater_stage_123e4567-e89b-42d3-a456-426614174103"
          test ! -e "$prefix"
