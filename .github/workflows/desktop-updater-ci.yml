          caller_sha="$(sha256sum "$prefix/bin/linux_installed_consumer" | awk '{print $1}')"
          helper_sha="$(sha256sum "$helper" | awk '{print $1}')"
          umask 077
          linux/native/build/linux_polkit_e2e_fixture \
