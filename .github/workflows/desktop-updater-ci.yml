          failures=()
          deferred_recovery_failure="$RUNNER_TEMP/desktop-updater-v3-linux-recovery-contract-failure.txt"
          if [ -s "$deferred_recovery_failure" ]; then
            failures+=("$(<"$deferred_recovery_failure")")
          fi
          fixture_build="$RUNNER_TEMP/desktop-updater-v3-removed-linux-cmake"
          cmake -S test/fixtures/v3_removed_api/linux-cmake -B "$fixture_build" -DDESKTOP_UPDATER_SOURCE_ROOT="$GITHUB_WORKSPACE"
          set +e
          output="$(cmake --build "$fixture_build" 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            failures+=("Legacy Linux CMake consumer unexpectedly compiled: ScheduleInstallAndRelaunch")
          elif [[ "$output" != *"ScheduleInstallAndRelaunch"* ]]; then
            failures+=("Legacy Linux CMake fixture failed without its intended ScheduleInstallAndRelaunch diagnostic.")
          fi
          if [ "${#failures[@]}" -ne 0 ]; then
            printf '%s\n' "${failures[@]}" >&2
            exit 1
