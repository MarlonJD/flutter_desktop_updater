name: Desktop Updater CI

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  dart:
    name: Dart Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Check generated native contract fixtures
        run: dart run tool/generate_native_contract_fixtures.dart --check
      - name: Check synchronized native SDK versions
        run: dart run tool/version_check.dart
      - name: Check formatting
        run: dart format --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test Dart surface
        run: flutter test --no-pub
      - name: Check CLI entrypoints
        run: |
          dart run desktop_updater --help
          dart run desktop_updater --version
          dart run desktop_updater release publish --help
          dart run desktop_updater package --help
          dart run desktop_updater verify --help
          dart run desktop_updater app-archive --help
          dart run desktop_updater:package --help
          dart run desktop_updater:verify --help
          dart run desktop_updater:app_archive --help
          dart run desktop_updater:release publish --help
      - name: Pub publish dry-run
        run: dart pub publish --dry-run

  cli-candidates:
    name: Standalone CLI candidate (${{ matrix.artifact }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            artifact: desktop-updater-macos-arm64
            checksum: shasum -a 256
          - runner: macos-15-intel
            artifact: desktop-updater-macos-x64
            checksum: shasum -a 256
          - runner: windows-latest
            artifact: desktop-updater-windows-x64.exe
          - runner: ubuntu-latest
            artifact: desktop-updater-linux-x64
            checksum: sha256sum
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Build and checksum Unix candidate-only CLI
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p artifacts
          dart compile exe bin/desktop_updater.dart -o "artifacts/${{ matrix.artifact }}"
          chmod +x "artifacts/${{ matrix.artifact }}"
          "artifacts/${{ matrix.artifact }}" --version
          cd artifacts
          ${{ matrix.checksum }} "${{ matrix.artifact }}" > SHA256SUMS
      - name: Build and checksum Windows candidate-only CLI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          dart compile exe bin/desktop_updater.dart -o "artifacts/${{ matrix.artifact }}"
          & "artifacts/${{ matrix.artifact }}" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash "artifacts/${{ matrix.artifact }}" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ${{ matrix.artifact }}" | Set-Content artifacts/SHA256SUMS
      # CI outputs are unsigned candidate-only evidence. Production macOS and
      # Windows assets must use the repository's approved signing workflows.
      - name: Upload candidate-only CLI and SHA256SUMS
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-candidate-only
          path: |
            artifacts/${{ matrix.artifact }}
            artifacts/SHA256SUMS
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - name: Install dependencies
        run: flutter pub get
      - name: Configure standalone Windows native SDK tests
        run: cmake -S windows/native -B windows/native/build -DDESKTOP_UPDATER_NATIVE_BUILD_TESTS=ON -DDESKTOP_UPDATER_NATIVE_RUNTIME=ON
      - name: Build standalone Windows native SDK tests
        run: cmake --build windows/native/build --config Release
      # Native transaction recovery remains blocked by Task 6; this CTest lane
      # must not be reported as recovery-journal evidence.
      - name: Run Windows Unicode and relative redirect target-host gates
        shell: pwsh
        run: |
          $serverOut = Join-Path $env:RUNNER_TEMP "native-transport-server.out"
          $serverErr = Join-Path $env:RUNNER_TEMP "native-transport-server.err"
          $server = Start-Process dart -ArgumentList @(
            "run", "tool/native_transport_fixture_server.dart", "--port", "43891"
          ) -RedirectStandardOutput $serverOut -RedirectStandardError $serverErr -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              try {
                Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:43891/health" | Out-Null
                $ready = $true
                break
              } catch {
                Start-Sleep -Milliseconds 250
              }
            }
            if (-not $ready) {
              Get-Content $serverOut, $serverErr -ErrorAction SilentlyContinue
              throw "Native transport fixture server did not start."
            }
            $env:DESKTOP_UPDATER_TRANSPORT_FIXTURE_URL = "http://127.0.0.1:43891"
            $output = & ctest --test-dir windows/native/build -C Release --output-on-failure 2>&1
            $exitCode = $LASTEXITCODE
            $output | ForEach-Object { Write-Host $_ }
            if ($exitCode -ne 0) { exit $exitCode }
            if (($output -join "`n") -match "No tests were found") {
              throw "Standalone Windows native CTest registered zero tests."
            }
          } finally {
            if (-not $server.HasExited) { Stop-Process -Id $server.Id -Force }
          }
      - name: Install Windows native SDK
        run: cmake --install windows/native/build --config Release --prefix windows/native/install
      - name: Verify installed Windows third-party notices
        shell: pwsh
        run: |
          $notice = "windows/native/install/share/doc/desktop_updater_native/THIRD_PARTY_NOTICES.md"
          if (-not (Test-Path -LiteralPath $notice -PathType Leaf)) {
            throw "Installed Windows SDK is missing $notice"
          }
      - name: Configure installed Windows CMake consumer
        shell: pwsh
        run: cmake -S example/native/windows-cmake -B example/native/windows-cmake/build "-DCMAKE_PREFIX_PATH=$env:GITHUB_WORKSPACE/windows/native/install"
      - name: Build installed Windows CMake consumer
        run: cmake --build example/native/windows-cmake/build --config Release
      - name: Run installed Windows CMake consumer
        shell: pwsh
        run: |
          $output = & ctest --test-dir example/native/windows-cmake/build -C Release --output-on-failure 2>&1
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) { exit $exitCode }
          if (($output -join "`n") -match "No tests were found") {
            throw "Windows installed consumer CTest registered zero tests."
          }
      - name: Run .NET native DLL consumer tests
        run: dotnet test windows/native/dotnet/DesktopUpdater.Native.Tests/DesktopUpdater.Native.Tests.csproj --configuration Release
      - name: Reject Debug CRT dependencies from Release native DLLs
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $visualStudio = & $vswhere -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($visualStudio)) {
            throw "Unable to locate Visual Studio C++ tools."
          }
          $dumpbin = Get-ChildItem "$visualStudio/VC/Tools/MSVC/*/bin/Hostx64/x64/dumpbin.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $dumpbin) { throw "Unable to locate dumpbin.exe." }
          $debugRuntimePattern = '(?i)\b(?:ucrtbased|vcruntime\d+(?:_\d+)?d|msvcp\d+(?:_[a-z_]+)?d)\.dll\b'
          $releaseDlls = @(
            "windows/native/build/Release/desktop_updater_native.dll",
            "windows/native/build/Release/desktop_updater_runtime.dll"
          )
          foreach ($dll in $releaseDlls) {
            $dependencies = (& $dumpbin.FullName /dependents $dll | Out-String)
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ($dependencies -match $debugRuntimePattern) {
              throw "$dll depends on Debug CRT $($Matches[0])"
            }
          }
      - name: Pack DesktopUpdater.Native
        shell: pwsh
        run: |
          $versionLine = Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)\s*$'
          if ($versionLine.Matches.Count -ne 1) {
            throw "Unable to read the canonical version from pubspec.yaml."
          }
          $version = $versionLine.Matches[0].Groups[1].Value
          $nativeDll = (Resolve-Path windows/native/build/Release/desktop_updater_native.dll).Path
          $runtimeDll = (Resolve-Path windows/native/build/Release/desktop_updater_runtime.dll).Path
          dotnet pack windows/native/dotnet/DesktopUpdater.Native/DesktopUpdater.Native.csproj --configuration Release --output windows/native/artifacts "-p:PackageVersion=$version" "-p:NativeDllPath=$nativeDll" "-p:RuntimeDllPath=$runtimeDll"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "DESKTOP_UPDATER_NATIVE_PACKAGE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify DesktopUpdater.Native package contents
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $package = "windows/native/artifacts/DesktopUpdater.Native.$env:DESKTOP_UPDATER_NATIVE_PACKAGE_VERSION.nupkg"
          $packagePath = (Resolve-Path $package).Path
          $archive = [System.IO.Compression.ZipFile]::OpenRead($packagePath)
          try {
            $entries = @($archive.Entries | ForEach-Object { $_.FullName })
            $required = @(
              "lib/net8.0/DesktopUpdater.Native.dll",
              "lib/netstandard2.0/DesktopUpdater.Native.dll",
              "runtimes/win-x64/native/desktop_updater_native.dll",
              "runtimes/win-x64/native/desktop_updater_runtime.dll",
              "buildTransitive/DesktopUpdater.Native.targets",
              "THIRD_PARTY_NOTICES.md"
            )
            foreach ($entry in $required) {
              if ($entries -notcontains $entry) {
                throw "NuGet package is missing $entry"
              }
            }
            $nuspec = $archive.GetEntry("DesktopUpdater.Native.nuspec")
            if ($null -eq $nuspec) {
              throw "NuGet package is missing DesktopUpdater.Native.nuspec"
            }
            $reader = [System.IO.StreamReader]::new($nuspec.Open())
            try {
              $nuspecText = $reader.ReadToEnd()
            } finally {
              $reader.Dispose()
            }
            $escapedVersion = [regex]::Escape($env:DESKTOP_UPDATER_NATIVE_PACKAGE_VERSION)
            if ($nuspecText -notmatch "<version>$escapedVersion</version>") {
              throw "NuGet package version does not match pubspec.yaml"
            }
          } finally {
            $archive.Dispose()
          }
      - name: Run isolated Release NuGet P/Invoke consumer
        shell: pwsh
        run: |
          $laneRoot = Join-Path $env:RUNNER_TEMP "desktop-updater-nuget-regular"
          $build = Join-Path $laneRoot "build"
          $packageSource = (Resolve-Path windows/native/artifacts).Path
          $package = (Resolve-Path "windows/native/artifacts/DesktopUpdater.Native.$env:DESKTOP_UPDATER_NATIVE_PACKAGE_VERSION.nupkg").Path
          & tool/verify_windows_nuget_consumer.ps1 -PackagePath $package -PackageSource $packageSource -ProjectPath example/native/windows-dotnet/DesktopUpdater.Consumer.csproj -LaneRoot $laneRoot -OutputPath $build -PackageVersion $env:DESKTOP_UPDATER_NATIVE_PACKAGE_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet (Join-Path $build "DesktopUpdater.Consumer.dll")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows native runtime ZIP smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $smokeRoot = Join-Path $env:RUNNER_TEMP "native-runtime-windows-zip"
          $packageSource = (Resolve-Path windows/native/artifacts).Path
          $package = (Resolve-Path "windows/native/artifacts/DesktopUpdater.Native.$env:DESKTOP_UPDATER_NATIVE_PACKAGE_VERSION.nupkg").Path
          $build = Join-Path $smokeRoot "build"
          & tool/verify_windows_nuget_consumer.ps1 -PackagePath $package -PackageSource $packageSource -ProjectPath example/native/windows-dotnet-runtime/DesktopUpdater.RuntimeCompile.csproj -LaneRoot $smokeRoot -OutputPath $build -PackageVersion $env:DESKTOP_UPDATER_NATIVE_PACKAGE_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $install = Join-Path $smokeRoot "install"
          $payload = Join-Path $smokeRoot "payload"
          Copy-Item -LiteralPath $build -Destination $install -Recurse
          Copy-Item -LiteralPath $build -Destination $payload -Recurse
          "2.7.0" | Set-Content (Join-Path $install "version.txt")
          "2.7.1" | Set-Content (Join-Path $payload "version.txt")
          $artifact = Join-Path $smokeRoot "update.zip"
          Compress-Archive -Path (Join-Path $payload "*") -DestinationPath $artifact
          $ready = Join-Path $smokeRoot "ready.json"
          $serverOut = Join-Path $smokeRoot "server.out"
          $serverErr = Join-Path $smokeRoot "server.err"
          $server = Start-Process dart -ArgumentList @(
            "run", "tool/native_runtime_smoke_server.dart",
            "--artifact", $artifact,
            "--artifact-kind", "zip",
            "--platform", "windows",
            "--package-id", "com.example.native-runtime-smoke",
            "--app-name", "NativeRuntimeSmoke",
            "--ready-file", $ready,
            "--port", "43892"
          ) -RedirectStandardOutput $serverOut -RedirectStandardError $serverErr -PassThru
          try {
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              if (Test-Path -LiteralPath $ready) {
                try {
                  Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:43892/health" | Out-Null
                  break
                } catch {}
              }
              Start-Sleep -Milliseconds 250
            }
            if (-not (Test-Path -LiteralPath $ready)) {
              Get-Content $serverOut, $serverErr -ErrorAction SilentlyContinue
              throw "Native runtime ZIP server did not start."
            }
            Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:43892/health" | Out-Null
            $serverInfo = Get-Content -Raw $ready | ConvertFrom-Json
            $env:DESKTOP_UPDATER_SMOKE_SKIP_RELAUNCH = "1"
            $diagnosticsPath = Join-Path $smokeRoot "helper-diagnostics.jsonl"
            & (Join-Path $install "DesktopUpdater.RuntimeCompile.exe") --smoke --app-archive-url $serverInfo.appArchiveUrl --public-key-base64 $serverInfo.publicKeyBase64 --package-id "com.example.native-runtime-smoke" --smoke-root (Join-Path $smokeRoot "runtime") --diagnostics-log $diagnosticsPath
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $stagingRoot = Join-Path $smokeRoot "runtime/staging"
            for ($attempt = 0; $attempt -lt 120; $attempt++) {
              $versionFile = Join-Path $install "version.txt"
              $versionReady = (Test-Path -LiteralPath $versionFile) -and ((Get-Content -Raw $versionFile).Trim() -eq "2.7.1")
              $stagingClean = (Test-Path -LiteralPath $stagingRoot -PathType Container) -and (@(Get-ChildItem -LiteralPath $stagingRoot -Force).Count -eq 0)
              $cleanupComplete = $false
              if (Test-Path -LiteralPath $diagnosticsPath) {
                $cleanupComplete = (Get-Content -Raw $diagnosticsPath) -match '"event":"cleanup success"'
              }
              if ($versionReady -and $stagingClean -and $cleanupComplete) { break }
              Start-Sleep -Milliseconds 250
            }
            if ((Get-Content -Raw (Join-Path $install "version.txt")).Trim() -ne "2.7.1") {
              throw "Windows ZIP runtime smoke did not install version 2.7.1."
            }
            if (-not $stagingClean) {
              throw "Windows ZIP runtime smoke left an owned staging child."
            }
            $diagnostics = Get-Content -Raw $diagnosticsPath
            if ($diagnostics -notmatch '"event":"move success"' -or $diagnostics -notmatch '"event":"cleanup success"') {
              throw "Windows ZIP runtime smoke diagnostics are incomplete."
            }
          } finally {
            if (Test-Path -LiteralPath $ready) {
              $serverInfo = Get-Content -Raw $ready | ConvertFrom-Json
              try {
                Invoke-WebRequest -UseBasicParsing -Method Post "http://127.0.0.1:43892/shutdown?token=$($serverInfo.shutdownToken)" | Out-Null
              } catch {}
            }
            if (-not $server.HasExited) { $server.WaitForExit(5000) | Out-Null }
            if (-not $server.HasExited) { Stop-Process -Id $server.Id -Force }
            Remove-Item -LiteralPath $smokeRoot -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: Windows native runtime Inno smoke
        if: github.event_name == 'workflow_dispatch' && vars.DESKTOP_UPDATER_RUN_SIGNED_NATIVE_RUNTIME_E2E == '1'
        shell: pwsh
        env:
          WINDOWS_CODE_SIGNING_P12_BASE64: ${{ secrets.WINDOWS_CODE_SIGNING_P12_BASE64 }}
          WINDOWS_CODE_SIGNING_P12_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGNING_P12_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CODE_SIGNING_P12_BASE64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_CODE_SIGNING_P12_PASSWORD)) {
            throw "Signed Inno runtime smoke credentials are required."
          }
          choco install innosetup --no-progress -y
          $smokeRoot = Join-Path $env:RUNNER_TEMP "native-runtime-windows-inno"
          $packageSource = (Resolve-Path windows/native/artifacts).Path
          $package = (Resolve-Path "windows/native/artifacts/DesktopUpdater.Native.$env:DESKTOP_UPDATER_NATIVE_PACKAGE_VERSION.nupkg").Path
          $build = Join-Path $smokeRoot "build"
          & tool/verify_windows_nuget_consumer.ps1 -PackagePath $package -PackageSource $packageSource -ProjectPath example/native/windows-dotnet-runtime/DesktopUpdater.RuntimeCompile.csproj -LaneRoot $smokeRoot -OutputPath $build -PackageVersion $env:DESKTOP_UPDATER_NATIVE_PACKAGE_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $install = Join-Path $smokeRoot "install"
          $payload = Join-Path $smokeRoot "payload"
          Copy-Item -LiteralPath $build -Destination $install -Recurse
          Copy-Item -LiteralPath $build -Destination $payload -Recurse
          "2.7.0" | Set-Content (Join-Path $install "version.txt")
          "2.7.1" | Set-Content (Join-Path $payload "version.txt")
          $iss = Join-Path $smokeRoot "runtime-smoke.iss"
          @(
            "[Setup]",
            "AppId=NativeRuntimeSmoke",
            "AppName=NativeRuntimeSmoke",
            "AppVersion=2.7.1",
            "DefaultDirName={autopf}\NativeRuntimeSmoke",
            "OutputDir=$smokeRoot",
            "OutputBaseFilename=native-runtime-smoke",
            "Uninstallable=no",
            "PrivilegesRequired=lowest",
            "ArchitecturesAllowed=x64compatible",
            "[Files]",
            "Source: `"$payload\*`"; DestDir: `"{app}`"; Flags: ignoreversion recursesubdirs createallsubdirs"
          ) | Set-Content -LiteralPath $iss -Encoding UTF8
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" $iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = Join-Path $smokeRoot "native-runtime-smoke.exe"
          $pfx = Join-Path $smokeRoot "code-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CODE_SIGNING_P12_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          if ($null -eq $signtool) { throw "signtool.exe was not found." }
          & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:WINDOWS_CODE_SIGNING_P12_PASSWORD $installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $certificate = [Security.Cryptography.X509Certificates.X509Certificate2]::new($pfx, $env:WINDOWS_CODE_SIGNING_P12_PASSWORD)
          $sha256 = [Security.Cryptography.SHA256]::Create()
          try { $publisher = ([BitConverter]::ToString($sha256.ComputeHash($certificate.RawData))).Replace('-', '') } finally { $sha256.Dispose(); $certificate.Dispose() }
          $ready = Join-Path $smokeRoot "ready.json"
          $server = Start-Process dart -ArgumentList @(
            "run", "tool/native_runtime_smoke_server.dart",
            "--artifact", $installer,
            "--artifact-kind", "innoInstaller",
            "--platform", "windows",
            "--package-id", "com.example.native-runtime-smoke",
            "--app-name", "NativeRuntimeSmoke",
            "--publisher-thumbprint", $publisher,
            "--ready-file", $ready,
            "--port", "43895"
          ) -PassThru
          try {
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              if (Test-Path -LiteralPath $ready) {
                try { Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:43895/health" | Out-Null; break } catch {}
              }
              Start-Sleep -Milliseconds 250
            }
            Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:43895/health" | Out-Null
            $serverInfo = Get-Content -Raw $ready | ConvertFrom-Json
            $env:DESKTOP_UPDATER_SMOKE_SKIP_RELAUNCH = "1"
            & (Join-Path $install "DesktopUpdater.RuntimeCompile.exe") --smoke --app-archive-url $serverInfo.appArchiveUrl --public-key-base64 $serverInfo.publicKeyBase64 --package-id "com.example.native-runtime-smoke" --smoke-root (Join-Path $smokeRoot "runtime") --diagnostics-log (Join-Path $smokeRoot "helper-diagnostics.jsonl")
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            for ($attempt = 0; $attempt -lt 240; $attempt++) {
              if ((Test-Path (Join-Path $install "version.txt")) -and ((Get-Content -Raw (Join-Path $install "version.txt")).Trim() -eq "2.7.1")) { break }
              Start-Sleep -Milliseconds 250
            }
            if ((Get-Content -Raw (Join-Path $install "version.txt")).Trim() -ne "2.7.1") { throw "Windows Inno runtime smoke did not install version 2.7.1." }
            $diagnostics = Get-Content -Raw (Join-Path $smokeRoot "helper-diagnostics.jsonl")
            if ($diagnostics -notmatch '"event":"inno authenticode verified"' -or $diagnostics -notmatch '"event":"inno installer success"') { throw "Windows Inno runtime smoke diagnostics are incomplete." }
          } finally {
            if (Test-Path -LiteralPath $ready) {
              $serverInfo = Get-Content -Raw $ready | ConvertFrom-Json
              try { Invoke-WebRequest -UseBasicParsing -Method Post "http://127.0.0.1:43895/shutdown?token=$($serverInfo.shutdownToken)" | Out-Null } catch {}
            }
            if (-not $server.HasExited) { $server.WaitForExit(5000) | Out-Null }
            if (-not $server.HasExited) { Stop-Process -Id $server.Id -Force }
            Remove-Item -LiteralPath $smokeRoot -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: Build example
        working-directory: example
        run: flutter build windows --debug
      - name: Build native tests
        working-directory: example
        run: cmake --build build/windows/x64 --config Debug --target desktop_updater_test
      - name: Run native tests
        working-directory: example
        shell: pwsh
        run: |
          $output = & ctest --test-dir build/windows/x64 -C Debug --output-on-failure 2>&1
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) { exit $exitCode }
          if (($output -join "`n") -match "No tests were found") {
            throw "Flutter Windows Debug CTest registered zero tests."
          }
      - name: Run integration tests
        working-directory: example
        run: flutter test integration_test -d windows
      - name: Rebuild example for smoke
        working-directory: example
        run: flutter build windows --debug
      - name: Run update smoke
        working-directory: example
        run: dart run tool/updater_smoke.dart --diagnostics-log ../reports/windows-update-smoke-debug-diagnostics.jsonl
      - name: Windows Inno update smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tool/windows_inno_smoke.ps1
      - name: Upload update smoke diagnostics
        if: ${{ failure() || vars.DESKTOP_UPDATER_UPLOAD_SMOKE_DIAGNOSTICS == '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-update-smoke-debug-diagnostics
          path: reports/windows-update-smoke-debug-diagnostics.jsonl
          if-no-files-found: ignore
      - name: Upload Windows Inno update smoke diagnostics
        if: ${{ failure() || vars.DESKTOP_UPDATER_UPLOAD_SMOKE_DIAGNOSTICS == '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-inno-update-smoke-diagnostics
          path: reports/windows-inno-update-smoke-diagnostics.jsonl
          if-no-files-found: ignore
      - name: Build example release
        working-directory: example
        run: flutter build windows --release
      - name: Build native tests release
        working-directory: example
        run: cmake --build build/windows/x64 --config Release --target desktop_updater_test
      - name: Run native tests release
        working-directory: example
        shell: pwsh
        run: |
          $output = & ctest --test-dir build/windows/x64 -C Release --output-on-failure 2>&1
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) { exit $exitCode }
          if (($output -join "`n") -match "No tests were found") {
            throw "Flutter Windows Release CTest registered zero tests."
          }
      - name: Run integration tests release
        working-directory: example
        run: flutter test integration_test -d windows
      - name: Run release publish smoke
        working-directory: example
        run: dart run tool/release_publish_smoke.dart --platform windows
      - name: Run update smoke release
        working-directory: example
        run: dart run tool/updater_smoke.dart --config Release --diagnostics-log ../reports/windows-update-smoke-release-diagnostics.jsonl
      - name: Upload update smoke release diagnostics
        if: ${{ failure() || vars.DESKTOP_UPDATER_UPLOAD_SMOKE_DIAGNOSTICS == '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-update-smoke-release-diagnostics
          path: reports/windows-update-smoke-release-diagnostics.jsonl
          if-no-files-found: ignore

  macos-native:
    name: macOS Native Consumer
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Typecheck macOS 10.14 CocoaPods fallback source set
        run: xcrun swiftc -typecheck -target x86_64-apple-macosx10.14 -swift-version 5 -module-cache-path "$RUNNER_TEMP/desktop-updater-swift-module-cache" -F "$FLUTTER_ROOT/bin/cache/artifacts/engine/darwin-x64/FlutterMacOS.xcframework/macos-arm64_x86_64" macos/desktop_updater/Sources/DesktopUpdaterKit/DesktopUpdaterVersion.swift macos/desktop_updater/Sources/DesktopUpdaterKit/Diagnostics.swift macos/desktop_updater/Sources/DesktopUpdaterKit/MacInstallHelper.swift macos/desktop_updater/Sources/DesktopUpdaterKit/MacInstallRequest.swift macos/desktop_updater/Sources/desktop_updater/DesktopUpdaterPlugin.swift
      - name: Run DesktopUpdaterKit SwiftPM tests
        run: swift test --package-path .
      - name: Run external SwiftPM consumer
        run: swift run --package-path example/native/macos
      - name: macOS native runtime ZIP smoke
        shell: bash
        run: |
          set -euo pipefail
          smoke_root="$RUNNER_TEMP/native-runtime-macos-zip"
          ready_file="$smoke_root/ready.json"
          package_id="com.example.native-runtime-smoke"
          app_name="NativeRuntimeSmoke.app"
          rm -rf "$smoke_root"
          mkdir -p "$smoke_root/install/$app_name/Contents/MacOS" "$smoke_root/install/$app_name/Contents/Resources"
          mkdir -p "$smoke_root/payload/$app_name/Contents/MacOS" "$smoke_root/payload/$app_name/Contents/Resources"
          export DESKTOP_UPDATER_PACKAGE_PATH="$GITHUB_WORKSPACE"
          swift build --package-path example/native/macos-runtime
          consumer_bin="$(swift build --package-path example/native/macos-runtime --show-bin-path)/MacOSRuntimeCompile"
          for app_root in "$smoke_root/install/$app_name" "$smoke_root/payload/$app_name"; do
            cp "$consumer_bin" "$app_root/Contents/MacOS/NativeRuntimeSmoke"
            chmod +x "$app_root/Contents/MacOS/NativeRuntimeSmoke"
            plutil -create xml1 "$app_root/Contents/Info.plist"
            /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string $package_id" "$app_root/Contents/Info.plist"
            /usr/libexec/PlistBuddy -c "Add :CFBundleExecutable string NativeRuntimeSmoke" "$app_root/Contents/Info.plist"
            /usr/libexec/PlistBuddy -c "Add :CFBundlePackageType string APPL" "$app_root/Contents/Info.plist"
          done
          printf '2.7.0\n' > "$smoke_root/install/$app_name/Contents/Resources/version.txt"
          printf '2.7.1\n' > "$smoke_root/payload/$app_name/Contents/Resources/version.txt"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$smoke_root/payload/$app_name" "$smoke_root/update.zip"
          dart run tool/native_runtime_smoke_server.dart \
            --artifact "$smoke_root/update.zip" \
            --artifact-kind zip \
            --platform macos \
            --package-id "$package_id" \
            --app-name "$app_name" \
            --allow-unsigned-artifact \
            --ready-file "$ready_file" \
            --port 43892 > "$smoke_root/server.log" 2>&1 &
          server_pid=$!
          cleanup() {
            if [ -f "$ready_file" ]; then
              token="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["shutdownToken"])' "$ready_file")"
              curl --silent --request POST "http://127.0.0.1:43892/shutdown?token=$token" >/dev/null 2>&1 || true
            fi
            wait "$server_pid" 2>/dev/null || true
            rm -rf "$smoke_root"
          }
          trap cleanup EXIT
          for attempt in $(seq 1 60); do
            if [ -f "$ready_file" ] && curl --fail --silent http://127.0.0.1:43892/health >/dev/null; then break; fi
            sleep 0.25
          done
          test -f "$ready_file"
          curl --fail --silent http://127.0.0.1:43892/health >/dev/null
          archive_url="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["appArchiveUrl"])' "$ready_file")"
          public_key="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["publicKeyBase64"])' "$ready_file")"
          export DESKTOP_UPDATER_SMOKE_SKIP_RELAUNCH=1
          "$smoke_root/install/$app_name/Contents/MacOS/NativeRuntimeSmoke" \
            --smoke \
            --app-archive-url "$archive_url" \
            --public-key-base64 "$public_key" \
            --package-id "$package_id" \
            --smoke-root "$smoke_root/runtime" \
            --diagnostics-log "$smoke_root/helper-diagnostics.jsonl" \
            --bundle-path "$smoke_root/install/$app_name" \
            --allow-unsigned-updates
          for attempt in $(seq 1 60); do
            if [ "$(tr -d '\r\n' < "$smoke_root/install/$app_name/Contents/Resources/version.txt" 2>/dev/null || true)" = "2.7.1" ]; then break; fi
            sleep 0.25
          done
          test "$(tr -d '\r\n' < "$smoke_root/install/$app_name/Contents/Resources/version.txt")" = "2.7.1"
          test -d "$smoke_root/runtime/staging"
          test -z "$(find "$smoke_root/runtime/staging" -mindepth 1 -maxdepth 1 -print -quit)"
          grep -q '"event":"move success"' "$smoke_root/helper-diagnostics.jsonl"
          grep -q '"event":"cleanup success"' "$smoke_root/helper-diagnostics.jsonl"
          test -s "$smoke_root/runtime/runtime-diagnostics.log"

  macos-flutter:
    name: macOS Flutter (${{ matrix.integration }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        integration: [swiftpm, cocoapods]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop
      - name: Enable SwiftPM integration
        if: matrix.integration == 'swiftpm'
        run: flutter config --enable-swift-package-manager
      - name: Enable CocoaPods fallback integration
        if: matrix.integration == 'cocoapods'
        run: flutter config --no-enable-swift-package-manager
      - name: Clean CocoaPods fallback build
        if: matrix.integration == 'cocoapods'
        working-directory: example
        run: flutter clean
      - name: Install example dependencies
        working-directory: example
        run: flutter pub get
      - name: Configure ad hoc CI signing
        working-directory: example
        run: |
          sed -i '' \
            -e 's/CODE_SIGN_IDENTITY = "Apple Development";/CODE_SIGN_IDENTITY = "-";/g' \
            -e 's/"CODE_SIGN_IDENTITY\[sdk=macosx\*\]" = "Apple Development";/"CODE_SIGN_IDENTITY[sdk=macosx*]" = "-";/g' \
            -e 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' \
            -e '/DEVELOPMENT_TEAM = /d' \
            macos/Runner.xcodeproj/project.pbxproj
      - name: Build macOS example
        working-directory: example
        run: flutter build macos --debug
      - name: Run macOS integration tests
        working-directory: example
        run: flutter test integration_test -d macos

  macos-notarized:
    name: macOS Notarized Publish
    runs-on: macos-latest
    if: github.event_name == 'workflow_dispatch' && (vars.DESKTOP_UPDATER_RUN_NOTARIZED_PUBLISH_E2E == '1' || vars.DESKTOP_UPDATER_RUN_SIGNED_NATIVE_RUNTIME_E2E == '1')
    # Signed production and native runtime lanes remain explicit
    # workflow_dispatch gates requiring Developer ID Application,
    # Developer ID Installer, and notary credentials:
    # dart run tool/macos_production_smoke.dart all --cleanup
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop
      - name: Install dependencies
        run: flutter pub get
      - name: Configure Developer ID certificate
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          test -n "$MACOS_CERTIFICATE_P12_BASE64"
          test -n "$MACOS_CERTIFICATE_PASSWORD"
          test -n "$MACOS_KEYCHAIN_PASSWORD"
          KEYCHAIN_PATH="$RUNNER_TEMP/desktop-updater-notary.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "DESKTOP_UPDATER_MACOS_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
      - name: Configure notary profile
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          DESKTOP_UPDATER_MACOS_NOTARY_PROFILE: desktop-updater-notary
        run: |
          test -n "$APPLE_ID"
          test -n "$APPLE_TEAM_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          xcrun notarytool store-credentials "$DESKTOP_UPDATER_MACOS_NOTARY_PROFILE" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --keychain "$DESKTOP_UPDATER_MACOS_KEYCHAIN"
          echo "DESKTOP_UPDATER_MACOS_NOTARY_PROFILE=$DESKTOP_UPDATER_MACOS_NOTARY_PROFILE" >> "$GITHUB_ENV"
      - name: Run notarized release publish smoke
        if: vars.DESKTOP_UPDATER_RUN_NOTARIZED_PUBLISH_E2E == '1'
        working-directory: example
        env:
          DESKTOP_UPDATER_RUN_NOTARIZED_PUBLISH_E2E: "1"
          DESKTOP_UPDATER_MACOS_DEVELOPER_ID_APPLICATION: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION }}
        run: dart run tool/release_publish_smoke.dart --platform macos --notarize
      - name: macOS native runtime DMG smoke
        if: vars.DESKTOP_UPDATER_RUN_SIGNED_NATIVE_RUNTIME_E2E == '1'
        env:
          DESKTOP_UPDATER_DEV_ID_APP: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION }}
          DESKTOP_UPDATER_DEV_ID_INSTALLER: ${{ secrets.MACOS_DEVELOPER_ID_INSTALLER }}
          DESKTOP_UPDATER_NOTARY_PROFILE: desktop-updater-notary
          DESKTOP_UPDATER_TEST_BUNDLE_ID: com.example.native-runtime-smoke
          DESKTOP_UPDATER_TEST_WORKDIR: ${{ runner.temp }}/native-runtime-macos-signed
          DESKTOP_UPDATER_KEEP_MACOS_SMOKE: "1"
        shell: bash
        run: |
          set -euo pipefail
          dart run tool/macos_production_smoke.dart dmg-update
          export DESKTOP_UPDATER_PACKAGE_PATH="$GITHUB_WORKSPACE"
          swift build --package-path example/native/macos-runtime
          consumer_bin="$(swift build --package-path example/native/macos-runtime --show-bin-path)/MacOSRuntimeCompile"
          app_name="Desktop Updater Smoke"
          app_path="/Applications/$app_name.app"
          artifact="$DESKTOP_UPDATER_TEST_WORKDIR/$app_name.dmg"
          runtime_root="$DESKTOP_UPDATER_TEST_WORKDIR/native-dmg-runtime"
          ready_file="$runtime_root/ready.json"
          mkdir -p "$runtime_root"
          dart run tool/native_runtime_smoke_server.dart \
            --artifact "$artifact" \
            --artifact-kind dmg \
            --platform macos \
            --package-id "$DESKTOP_UPDATER_TEST_BUNDLE_ID" \
            --app-name "$app_name.app" \
            --ready-file "$ready_file" \
            --port 43893 > "$runtime_root/server.log" 2>&1 &
          server_pid=$!
          shutdown_server() {
            if [ -f "$ready_file" ]; then
              token="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["shutdownToken"])' "$ready_file")"
              curl --silent --request POST "http://127.0.0.1:43893/shutdown?token=$token" >/dev/null 2>&1 || true
            fi
            wait "$server_pid" 2>/dev/null || true
          }
          trap shutdown_server EXIT
          for attempt in $(seq 1 60); do
            if [ -f "$ready_file" ] && curl --fail --silent http://127.0.0.1:43893/health >/dev/null; then break; fi
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:43893/health >/dev/null
          archive_url="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["appArchiveUrl"])' "$ready_file")"
          public_key="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["publicKeyBase64"])' "$ready_file")"
          team_id="$(codesign -dv --verbose=4 "$app_path" 2>&1 | awk -F= '/^TeamIdentifier=/{print $2; exit}')"
          test -n "$team_id"
          export DESKTOP_UPDATER_SMOKE_SKIP_RELAUNCH=1
          "$consumer_bin" \
            --smoke \
            --app-archive-url "$archive_url" \
            --public-key-base64 "$public_key" \
            --package-id "$DESKTOP_UPDATER_TEST_BUNDLE_ID" \
            --smoke-root "$runtime_root/client" \
            --diagnostics-log "$runtime_root/helper-diagnostics.jsonl" \
            --bundle-path "$app_path" \
            --expected-team-identifier "$team_id"
          for attempt in $(seq 1 120); do
            if grep -q '"event":"cleanup success"' "$runtime_root/helper-diagnostics.jsonl" 2>/dev/null; then break; fi
            sleep 0.25
          done
          grep -q '"event":"move success"' "$runtime_root/helper-diagnostics.jsonl"
          grep -q '"event":"cleanup success"' "$runtime_root/helper-diagnostics.jsonl"
      - name: macOS native runtime PKG smoke
        if: vars.DESKTOP_UPDATER_RUN_SIGNED_NATIVE_RUNTIME_E2E == '1'
        env:
          DESKTOP_UPDATER_DEV_ID_APP: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION }}
          DESKTOP_UPDATER_DEV_ID_INSTALLER: ${{ secrets.MACOS_DEVELOPER_ID_INSTALLER }}
          DESKTOP_UPDATER_NOTARY_PROFILE: desktop-updater-notary
          DESKTOP_UPDATER_TEST_BUNDLE_ID: com.example.native-runtime-smoke
          DESKTOP_UPDATER_TEST_WORKDIR: ${{ runner.temp }}/native-runtime-macos-signed
          DESKTOP_UPDATER_KEEP_MACOS_SMOKE: "1"
        shell: bash
        run: |
          set -euo pipefail
          dart run tool/macos_production_smoke.dart pkg-installer
          export DESKTOP_UPDATER_PACKAGE_PATH="$GITHUB_WORKSPACE"
          swift build --package-path example/native/macos-runtime
          consumer_bin="$(swift build --package-path example/native/macos-runtime --show-bin-path)/MacOSRuntimeCompile"
          app_name="Desktop Updater Smoke"
          artifact="$DESKTOP_UPDATER_TEST_WORKDIR/$app_name.pkg"
          runtime_root="$DESKTOP_UPDATER_TEST_WORKDIR/native-pkg-runtime"
          ready_file="$runtime_root/ready.json"
          mkdir -p "$runtime_root"
          dart run tool/native_runtime_smoke_server.dart \
            --artifact "$artifact" \
            --artifact-kind pkgInstaller \
            --platform macos \
            --package-id "$DESKTOP_UPDATER_TEST_BUNDLE_ID" \
            --app-name "$app_name.app" \
            --ready-file "$ready_file" \
            --port 43894 > "$runtime_root/server.log" 2>&1 &
          server_pid=$!
          shutdown_server() {
            if [ -f "$ready_file" ]; then
              token="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["shutdownToken"])' "$ready_file")"
              curl --silent --request POST "http://127.0.0.1:43894/shutdown?token=$token" >/dev/null 2>&1 || true
            fi
            wait "$server_pid" 2>/dev/null || true
          }
          trap shutdown_server EXIT
          for attempt in $(seq 1 60); do
            if [ -f "$ready_file" ] && curl --fail --silent http://127.0.0.1:43894/health >/dev/null; then break; fi
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:43894/health >/dev/null
          archive_url="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["appArchiveUrl"])' "$ready_file")"
          public_key="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["publicKeyBase64"])' "$ready_file")"
          export DESKTOP_UPDATER_SMOKE_SKIP_RELAUNCH=1
          "$consumer_bin" \
            --smoke \
            --app-archive-url "$archive_url" \
            --public-key-base64 "$public_key" \
            --package-id "$DESKTOP_UPDATER_TEST_BUNDLE_ID" \
            --smoke-root "$runtime_root/client" \
            --diagnostics-log "$runtime_root/helper-diagnostics.jsonl" \
            --bundle-path "/Applications/$app_name.app"
          for attempt in $(seq 1 120); do
            if grep -q '"event":"pkg installer opened"' "$runtime_root/helper-diagnostics.jsonl" 2>/dev/null; then break; fi
            sleep 0.25
          done
          grep -q '"event":"pkg manifest loaded"' "$runtime_root/helper-diagnostics.jsonl"
          grep -q '"event":"pkg installer opened"' "$runtime_root/helper-diagnostics.jsonl"
      - name: Clean native runtime macOS smoke roots
        if: always() && vars.DESKTOP_UPDATER_RUN_SIGNED_NATIVE_RUNTIME_E2E == '1'
        env:
          DESKTOP_UPDATER_TEST_BUNDLE_ID: com.example.native-runtime-smoke
          DESKTOP_UPDATER_TEST_WORKDIR: ${{ runner.temp }}/native-runtime-macos-signed
        run: dart run tool/macos_production_smoke.dart cleanup

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libcurl4-openssl-dev libgtk-3-dev libssl-dev ninja-build pkg-config xvfb zip
      - name: Configure standalone Linux native tests
        run: cmake -S linux/native -B linux/native/build -DDESKTOP_UPDATER_NATIVE_BUILD_TESTS=ON -DDESKTOP_UPDATER_NATIVE_RUNTIME=ON
      - name: Build standalone Linux native tests
        run: cmake --build linux/native/build
      # Native transaction recovery remains blocked by Task 6; this CTest lane
      # must not be reported as mount/bind recovery evidence.
      - name: Run Linux native tamper target-host gates
        run: |
          dart run tool/native_transport_fixture_server.dart --port 43891 >"$RUNNER_TEMP/native-transport-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:43891/health >/dev/null; then
              ready=1
              break
            fi
            sleep 0.25
          done
          if [ "$ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/native-transport-server.log"
            exit 1
          fi
          export DESKTOP_UPDATER_TRANSPORT_FIXTURE_URL=http://127.0.0.1:43891
          set +e
          output="$(ctest --test-dir linux/native/build --output-on-failure 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          if [[ "$output" == *"No tests were found"* ]]; then
            echo "Linux native CTest registered zero tests"
            exit 1
          fi
      - name: Install Linux native SDK
        run: cmake --install linux/native/build --prefix "$PWD/linux/native/install"
      - name: Verify installed Linux third-party notices
        run: test -f linux/native/install/share/doc/desktop_updater_native/THIRD_PARTY_NOTICES.md
      - name: Verify installed Linux pkg-config version
        run: |
          expected="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml)"
          actual="$(PKG_CONFIG_PATH="$PWD/linux/native/install/lib/pkgconfig" pkg-config --modversion desktop_updater_native)"
          test "$actual" = "$expected"
      - name: Build and run installed Linux pkg-config consumer
        run: |
          pc_path="$PWD/linux/native/install/lib/pkgconfig"
          c++ example/native/linux-cmake/main.cpp \
            $(PKG_CONFIG_PATH="$pc_path" pkg-config --cflags --libs desktop_updater_native) \
            -o linux/native/install/pkg-config-consumer
          linux/native/install/pkg-config-consumer
      - name: Configure Linux multiarch pkg-config package
        run: |
          cmake -S linux/native -B linux/native/build-multiarch \
            -DCMAKE_INSTALL_LIBDIR=lib/x86_64-linux-gnu
          cmake --build linux/native/build-multiarch
          cmake --install linux/native/build-multiarch \
            --prefix "$PWD/linux/native/install-multiarch"
      - name: Build and run Linux multiarch pkg-config consumer
        run: |
          pc_path="$PWD/linux/native/install-multiarch/lib/x86_64-linux-gnu/pkgconfig"
          c++ example/native/linux-cmake/main.cpp \
            $(PKG_CONFIG_PATH="$pc_path" pkg-config --cflags --libs desktop_updater_native) \
            -o linux/native/install-multiarch/pkg-config-consumer
          linux/native/install-multiarch/pkg-config-consumer
      - name: Configure installed Linux CMake consumer
        run: cmake -S example/native/linux-cmake -B example/native/linux-cmake/build -DCMAKE_PREFIX_PATH="$PWD/linux/native/install"
      - name: Build installed Linux CMake consumer
        run: cmake --build example/native/linux-cmake/build
      - name: Run installed Linux CMake consumer
        run: |
          set +e
          output="$(ctest --test-dir example/native/linux-cmake/build --output-on-failure 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          if [[ "$output" == *"No tests were found"* ]]; then
            echo "Linux installed consumer CTest registered zero tests"
            exit 1
          fi
      - name: Linux native runtime ZIP smoke
        shell: bash
        run: |
          set -euo pipefail
          cmake -S example/native/linux-cmake-runtime -B example/native/linux-cmake-runtime/build -DCMAKE_PREFIX_PATH="$PWD/linux/native/install"
          cmake --build example/native/linux-cmake-runtime/build
          set +e
          compile_output="$(ctest --test-dir example/native/linux-cmake-runtime/build --output-on-failure 2>&1)"
          compile_status=$?
          set -e
          printf '%s\n' "$compile_output"
          if [ "$compile_status" -ne 0 ]; then exit "$compile_status"; fi
          if [[ "$compile_output" == *"No tests were found"* ]]; then
            echo "Linux runtime consumer CTest registered zero tests"
            exit 1
          fi
          smoke_root="$RUNNER_TEMP/native-runtime-linux-zip"
          ready_file="$smoke_root/ready.json"
          rm -rf "$smoke_root"
          mkdir -p "$smoke_root/install" "$smoke_root/payload"
          consumer_bin="$PWD/example/native/linux-cmake-runtime/build/runtime_compile"
          cp "$consumer_bin" "$smoke_root/install/runtime_compile"
          cp "$consumer_bin" "$smoke_root/payload/runtime_compile"
          chmod +x "$smoke_root/install/runtime_compile" "$smoke_root/payload/runtime_compile"
          printf '2.7.0\n' > "$smoke_root/install/version.txt"
          printf '2.7.1\n' > "$smoke_root/payload/version.txt"
          printf '%s' '{"packageId":"com.example.native-runtime-smoke","schemaVersion":1}' > "$smoke_root/install/.desktop_updater_install_identity.json"
          printf '%s' '{"packageId":"com.example.native-runtime-smoke","schemaVersion":1}' > "$smoke_root/payload/.desktop_updater_install_identity.json"
          (cd "$smoke_root/payload" && zip -qr "$smoke_root/update.zip" .)
          dart run tool/native_runtime_smoke_server.dart \
            --artifact "$smoke_root/update.zip" \
            --artifact-kind zip \
            --platform linux \
            --package-id com.example.native-runtime-smoke \
            --app-name NativeRuntimeSmoke \
            --ready-file "$ready_file" \
            --port 43892 > "$smoke_root/server.log" 2>&1 &
          server_pid=$!
          cleanup() {
            if [ -f "$ready_file" ]; then
              token="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["shutdownToken"])' "$ready_file")"
              curl --silent --request POST "http://127.0.0.1:43892/shutdown?token=$token" >/dev/null 2>&1 || true
            fi
            wait "$server_pid" 2>/dev/null || true
            rm -rf "$smoke_root"
          }
          trap cleanup EXIT
          for attempt in $(seq 1 60); do
            if [ -f "$ready_file" ] && curl --fail --silent http://127.0.0.1:43892/health >/dev/null; then break; fi
            sleep 0.25
          done
          test -f "$ready_file"
          curl --fail --silent http://127.0.0.1:43892/health >/dev/null
          archive_url="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["appArchiveUrl"])' "$ready_file")"
          public_key="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["publicKeyHex"])' "$ready_file")"
          export DESKTOP_UPDATER_SMOKE_SKIP_RELAUNCH=1
          "$smoke_root/install/runtime_compile" \
            --smoke \
            --verify-protected-root \
            --app-archive-url "$archive_url" \
            --public-key-hex "$public_key" \
            --package-id com.example.native-runtime-smoke \
            --smoke-root "$smoke_root/runtime" \
            --install-root "$smoke_root/install" \
            --executable-relative-path runtime_compile \
            --diagnostics-log "$smoke_root/helper-diagnostics.jsonl"
          for attempt in $(seq 1 120); do
            if [ "$(tr -d '\r\n' < "$smoke_root/install/version.txt" 2>/dev/null || true)" = "2.7.1" ]; then break; fi
            sleep 0.25
          done
          test "$(tr -d '\r\n' < "$smoke_root/install/version.txt")" = "2.7.1"
          test -d "$smoke_root/runtime/staging"
          test -z "$(find "$smoke_root/runtime/staging" -mindepth 1 -maxdepth 1 -print -quit)"
          grep -q '"event":"move success"' "$smoke_root/helper-diagnostics.jsonl"
          grep -q '"event":"cleanup success"' "$smoke_root/helper-diagnostics.jsonl"
          test -s "$smoke_root/runtime/runtime-diagnostics.log"
      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop
      - name: Install dependencies
        run: flutter pub get
      - name: Build example
        working-directory: example
        run: flutter build linux --debug
      - name: Build native tests
        working-directory: example
        run: cmake --build build/linux/x64/debug --target desktop_updater_test
      - name: Run native tests
        working-directory: example
        run: |
          set +e
          output="$(ctest --test-dir build/linux/x64/debug --output-on-failure 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          if [[ "$output" == *"No tests were found"* ]]; then
            echo "Linux Flutter debug CTest registered zero tests"
            exit 1
          fi
      - name: Run integration tests
        working-directory: example
        run: xvfb-run -a flutter test integration_test -d linux
      - name: Rebuild example for smoke
        working-directory: example
        run: flutter build linux --debug
      - name: Run update smoke
        working-directory: example
        run: xvfb-run -a dart run tool/updater_smoke.dart --diagnostics-log ../reports/linux-update-smoke-debug-diagnostics.jsonl
      - name: Upload update smoke diagnostics
        if: ${{ failure() || vars.DESKTOP_UPDATER_UPLOAD_SMOKE_DIAGNOSTICS == '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-update-smoke-debug-diagnostics
          path: reports/linux-update-smoke-debug-diagnostics.jsonl
          if-no-files-found: ignore
      - name: Build example release
        working-directory: example
        run: flutter build linux --release
      - name: Build native tests release
        working-directory: example
        run: cmake --build build/linux/x64/release --target desktop_updater_test
      - name: Run native tests release
        working-directory: example
        run: |
          set +e
          output="$(ctest --test-dir build/linux/x64/release --output-on-failure 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          if [[ "$output" == *"No tests were found"* ]]; then
            echo "Linux Flutter release CTest registered zero tests"
            exit 1
          fi
      - name: Run integration tests release
        working-directory: example
        run: xvfb-run -a flutter test integration_test -d linux
      - name: Run release publish smoke
        working-directory: example
        run: dart run tool/release_publish_smoke.dart --platform linux
      - name: Run update smoke release
        working-directory: example
        run: xvfb-run -a dart run tool/updater_smoke.dart --config Release --diagnostics-log ../reports/linux-update-smoke-release-diagnostics.jsonl
      - name: Upload update smoke release diagnostics
        if: ${{ failure() || vars.DESKTOP_UPDATER_UPLOAD_SMOKE_DIAGNOSTICS == '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-update-smoke-release-diagnostics
          path: reports/linux-update-smoke-release-diagnostics.jsonl
          if-no-files-found: ignore
